<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wort — recipe design and batch log</title>
<meta name="theme-color" content="#0E1419">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Asap:ital,wght@0,400..700;1,400..600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#e8edec; --surface:#ffffff; --surface-2:#f3f6f6; --ink:#101a20; --muted:#5a6d79;
  --line:#ccd7dc; --line-strong:#aebdc4; --accent:#0f5a6b; --accent-ink:#ffffff;
  --accent-soft:#d6e8ec; --band:#bcd8de; --warn:#9c4414; --ok:#1d6b44;
  --shadow: 0 1px 0 rgba(16,26,32,.06);
  box-sizing:border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg:#0E1419; --surface:#16202A; --surface-2:#1B262E; --ink:#E3EBEF; --muted:#8ba2b0;
    --line:#26333d; --line-strong:#3a4b57; --accent:#56C4D8; --accent-ink:#06222a;
    --accent-soft:#0f3540; --band:#1d4a57; --warn:#e09457; --ok:#5fc08c;
    --shadow: 0 1px 0 rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg:#0E1419; --surface:#16202A; --surface-2:#1B262E; --ink:#E3EBEF; --muted:#8ba2b0;
  --line:#26333d; --line-strong:#3a4b57; --accent:#56C4D8; --accent-ink:#06222a;
  --accent-soft:#0f3540; --band:#1d4a57; --warn:#e09457; --ok:#5fc08c;
  --shadow: 0 1px 0 rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%; scroll-padding-top: env(safe-area-inset-top, 0px);}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Asap", ui-sans-serif, system-ui, sans-serif; font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%; font-variant-numeric: tabular-nums;}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); background:var(--surface); z-index:40;}
h1,h2,h3{font-family:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif; font-weight:700; letter-spacing:-.02em; margin:0;}
a{color:var(--accent)}
button{font:inherit; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}

.topbar{position:sticky; top:env(safe-area-inset-top,0px); z-index:30; background:var(--surface); border-bottom:1px solid var(--line);}
.topbar-in{max-width:1180px; margin:0 auto; padding:0 14px; display:flex; align-items:center; gap:12px; min-height:54px; flex-wrap:wrap}
.brand{display:flex; align-items:baseline; gap:9px; margin-right:auto}
.brand b{font-family:"Bricolage Grotesque"; font-weight:800; font-size:23px; letter-spacing:-.045em}
.brand span{color:var(--muted); font-size:12.5px}
.tabs{display:flex; gap:2px; flex-wrap:wrap}
.tab{background:none; border:1px solid transparent; color:var(--muted); padding:6px 11px; border-radius:999px; cursor:pointer}
.tab:hover{color:var(--ink)}
.tab[aria-current="true"]{background:var(--accent-soft); color:var(--ink); border-color:var(--line)}
.unit-toggle{display:flex; border:1px solid var(--line); border-radius:999px; overflow:hidden}
.unit-toggle button{background:var(--surface); border:0; color:var(--muted); padding:5px 10px; cursor:pointer; font-size:13px}
.unit-toggle button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
main{max-width:1180px; margin:0 auto; padding:20px 14px 90px}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel-head{display:flex; align-items:center; gap:10px; padding:12px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
.panel-head h2{font-size:15.5px; margin-right:auto}
.panel-body{padding:14px}
.btn{background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong); border-radius:7px; padding:6px 12px; cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn-quiet{background:none; border-color:transparent; color:var(--muted); padding:4px 7px}
.btn-quiet:hover{color:var(--ink); border-color:var(--line)}
.btn-sm{padding:3px 8px; font-size:13px}
input,select,textarea{font:inherit; font-variant-numeric:tabular-nums; color:var(--ink); background:var(--surface);
  border:1px solid var(--line-strong); border-radius:6px; padding:5px 8px; width:100%; min-width:0;}
textarea{resize:vertical; min-height:70px; line-height:1.55}
label.fld{display:block}
label.fld > span{display:block; font-size:12.5px; color:var(--muted); margin-bottom:3px}
.grid{display:grid; gap:10px}
.cols{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.muted{color:var(--muted)} .small{font-size:13px}
.empty{padding:28px 16px; text-align:center; color:var(--muted)}
.empty p{margin:0 0 12px}
table{width:100%; border-collapse:collapse}
th{text-align:left; font-weight:600; font-size:12.5px; color:var(--muted); padding:0 6px 6px; white-space:nowrap}
td{padding:3px 6px; vertical-align:middle}
td.num,th.num{text-align:right}
tr.row td{border-top:1px solid var(--line)}
.rowtools{display:flex; gap:2px; justify-content:flex-end}
.tablewrap{overflow-x:auto}

.cardlist{display:grid; gap:10px; grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.rcard{display:flex; gap:12px; text-align:left; width:100%; background:var(--surface); border:1px solid var(--line);
  border-radius:10px; padding:12px; cursor:pointer; align-items:stretch; color:inherit}
.rcard:hover{border-color:var(--accent)}
.swatch{width:9px; border-radius:3px; flex:0 0 9px; background:#ccc}
.rcard h3{font-size:16px; line-height:1.25}
.rcard .meta{color:var(--muted); font-size:12.5px; margin-top:2px}
.rcard .nums{margin-top:8px; display:flex; gap:12px; flex-wrap:wrap; font-size:13px}
.rcard .nums b{font-family:"Bricolage Grotesque"; font-weight:700}

.editor{display:grid; gap:14px; grid-template-columns:minmax(0,1fr) 300px; align-items:start}
@media (max-width:900px){ .editor{grid-template-columns:minmax(0,1fr)} }
.readout{position:sticky; top:calc(env(safe-area-inset-top,0px) + 66px)}
@media (max-width:900px){ .readout{position:static} }

.gauge{padding:9px 0; border-top:1px solid var(--line)}
.gauge:first-child{border-top:0}
.gauge-top{display:flex; align-items:baseline; gap:8px}
.gauge-label{font-size:12.5px; color:var(--muted); margin-right:auto}
.gauge-val{font-family:"Bricolage Grotesque"; font-weight:700; font-size:21px; letter-spacing:-.03em}
.gauge-range{font-size:11.5px; color:var(--muted)}
.track{position:relative; height:9px; margin-top:7px; background:var(--surface-2); border:1px solid var(--line); border-radius:5px}
.band{position:absolute; top:-1px; bottom:-1px; background:var(--band); border-radius:4px}
.tick{position:absolute; top:-4px; bottom:-4px; width:3px; border-radius:2px; background:var(--ink); transform:translateX(-1.5px)}
.tick.out{background:var(--warn)}
.beerbar{height:56px; border-radius:8px; border:1px solid var(--line-strong); display:flex; align-items:flex-end;
  justify-content:space-between; padding:7px 9px; color:#fff; font-size:12px; text-shadow:0 1px 2px rgba(0,0,0,.45)}

.kv{display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0; text-align:right}
.toolgrid{display:grid; gap:14px; grid-template-columns:repeat(auto-fill,minmax(285px,1fr))}
.result{margin-top:10px; padding:9px 11px; background:var(--surface-2); border:1px solid var(--line); border-radius:7px}
.result b{font-family:"Bricolage Grotesque"; font-weight:700; font-size:19px}
.status{font-size:12px; padding:2px 9px; border-radius:999px; border:1px solid var(--line-strong); color:var(--muted)}
.status.Fermenting{background:var(--accent-soft); color:var(--ink); border-color:var(--accent)}
.status.Packaged{background:var(--surface-2); color:var(--ok); border-color:var(--ok)}
.note{font-size:12.5px; color:var(--muted); margin-top:8px}
.syncline{font-size:12px; color:var(--muted); padding:6px 14px 0}
.chartwrap{overflow-x:auto}
.inline{display:flex; gap:8px; flex-wrap:wrap; align-items:flex-end}
.inline > *{flex:1 1 110px}
dialog{border:1px solid var(--line-strong); border-radius:12px; background:var(--surface); color:var(--ink);
  max-width:620px; width:calc(100% - 28px); padding:0}
dialog::backdrop{background:rgba(5,12,16,.55)}
.dlg-body{padding:16px}
fieldset{border:0; margin:0; padding:0; min-width:0}
.panel + fieldset{display:block; margin-top:14px}
fieldset[disabled]{opacity:.8}
fieldset[disabled] input,fieldset[disabled] select,fieldset[disabled] textarea{background:var(--surface-2); cursor:default}
.errbar{position:fixed; left:0; right:0; bottom:0; z-index:60; background:#7a1f12; color:#fff;
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); font-size:13px; line-height:1.45;
  white-space:pre-wrap; max-height:40vh; overflow:auto}
.errbar[hidden]{display:none}
.burger{display:none; align-items:center; justify-content:center; width:40px; height:40px; border-radius:9px;
  border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink); cursor:pointer; order:-1}
.scrim{position:fixed; inset:0; background:rgba(5,12,16,.55); z-index:48}
/* [hidden] is only display:none in the UA sheet, so an author display rule beats it. */
.drawer[hidden],.scrim[hidden]{display:none}
.drawer{position:fixed; top:0; bottom:0; left:0; width:min(300px,84vw); z-index:49; background:var(--surface);
  border-right:1px solid var(--line); display:flex; flex-direction:column; overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));
  box-shadow:4px 0 24px rgba(0,0,0,.28)}
.drawer h2{font-size:15px; padding:0 18px 12px}
.dlink{display:flex; align-items:center; gap:12px; min-height:48px; padding:0 18px; color:var(--muted);
  text-decoration:none; background:none; border:0; width:100%; font:inherit; font-size:15px; text-align:left; cursor:pointer}
.dlink:hover{color:var(--ink)}
.dlink[aria-current="true"]{color:var(--ink); background:var(--accent-soft); box-shadow:inset 3px 0 0 var(--accent)}
.dlink .dcount{margin-left:auto; font-size:12.5px; color:var(--muted)}
.drawer hr{border:0; border-top:1px solid var(--line); margin:10px 0}
.drawer .dsec{font-size:11.5px; color:var(--muted); padding:8px 18px 4px; font-weight:600}
@media (max-width:760px){ .burger{display:flex} #tabs{display:none} }
.actionbar{position:sticky; bottom:0; z-index:20; display:flex; gap:8px; margin-top:14px;
  padding:12px 0 calc(12px + env(safe-area-inset-bottom,0px)); background:var(--bg);
  border-top:1px solid var(--line)}
.subhead{font-size:13px; color:var(--muted); font-weight:600; margin:14px 0 6px}
.lockbar{padding:9px 14px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:13px; color:var(--muted)}
.lockmark{font-size:11.5px; color:var(--muted); border:1px solid var(--line-strong); border-radius:999px; padding:1px 7px}
.basedon{padding:9px 14px; background:var(--accent-soft); border-bottom:1px solid var(--line); font-size:13px}
.tclock{font-family:"Bricolage Grotesque"; font-weight:800; font-size:clamp(54px,17vw,96px); line-height:1; letter-spacing:-.045em; margin:4px 0 2px}
.tbar{height:7px; background:var(--surface-2); border:1px solid var(--line); border-radius:4px; margin-top:12px; overflow:hidden}
.tbar-fill{height:100%; background:var(--accent)}
.addrow{display:flex; gap:10px; align-items:center; padding:6px 9px; border:1px solid var(--line); border-radius:7px; margin-bottom:6px; font-size:14px}
.addrow.due{border-color:var(--accent); background:var(--accent-soft)}
.flash{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(18px + env(safe-area-inset-bottom,0px));
  background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:999px; z-index:60; font-size:14px}
</style>
</head>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand"><b>Wort</b><span>recipe design &amp; batch log</span></div>

    <div class="unit-toggle" id="units">

    </button>
  </div>
</header>
<div class="scrim" id="scrim" hidden></div>
<nav class="drawer" id="drawer" aria-label="Sections" hidden></nav>

/* ========================= calculations ========================= */
function mashPlan(r,grainLb){
  const m=r.mash||MASH_DEFAULT(), out=[];
  let waterQt=0, cur=num(m.grainTempF), G=grainLb, Tw=num(m.infuseTempF)||212;
  (m.steps||[]).forEach((st,i)=>{
    const T2=num(st.tempF); let infuseQt=0, note="", waterF=0;
    if(st.type==="Infusion"){
      if(i===0||waterQt===0){
        infuseQt = G*(num(m.thickQtLb)||1.33);
        const strike = infuseQt>0 ? (0.2/(num(m.thickQtLb)||1.33))*(T2-cur)+T2 : T2;
        waterF = strike;
        note = G>0 ? `strike at ${tOut(strike)} ${tLbl()}` : "no mashable grain";
      } else if(T2<=cur){
        /* Hot water cannot cool a mash. Without this the heat balance returns a
           negative volume and quietly takes water back out of the tun. */
        infuseQt = 0;
        note = `no infusion — this step is not hotter than the one before it`;
      } else {
        const denom = Tw - T2;
        infuseQt = denom>0 ? (T2-cur)*(0.2*G + waterQt)/denom : 0;
        waterF = Tw;
        note = denom>0 ? `add at ${tOut(Tw)} ${tLbl()}`
                       : `infusion water must be hotter than ${tOut(T2)} ${tLbl()}`;
      }
    } else if(st.type==="Decoction"){
      const pull = (T2>cur && 212>cur) ? (T2-cur)/(212-cur)*(waterQt+0.2*G) : 0;
      note = `pull ≈ ${isMetric()?rnd(pull*U.qtL,1)+" L":rnd(pull/4,2)+" gal"} of thick mash, boil, return`;
    } else {
      note = st.rampMin>0 ? `direct heat, ${st.rampMin} min ramp` : "direct heat";
    }
    waterQt += infuseQt; cur = T2;
    out.push({step:st, infuseQt, note, waterF, totalQt:waterQt});
  });
  return {rows:out, mashWaterQt:waterQt};
}
function hltRows(r,c){
  const m=r.mash||MASH_DEFAULT(), rows=[];
  (c.mp.rows||[]).forEach((p,i)=>{
    if(p.infuseQt>0.001) rows.push({what:(i===0?"Strike — ":"")+(p.step.name||("Step "+(i+1))),
      gal:p.infuseQt/4, tempF:p.waterF});
  });
  if(c.sparge>0.001) rows.push({what:"Sparge", gal:c.sparge, tempF:num(m.spargeTempF)});
  return rows;
}
function hltTable(r,c){
  const rows=hltRows(r,c);
  if(!rows.length) return `<p class="muted small" style="margin:4px 0">Add mashable grain to see the water plan.</p>`;
  const tot=rows.reduce((a,x)=>a+x.gal,0);
  return `<table><thead><tr><th>Heat</th><th class="num">${vLbl()}</th><th class="num">${tLbl()}</th></tr></thead><tbody>`
    + rows.map((x,i)=>`<tr class="row"><td>${i+1}. ${esc(x.what)}</td>
        <td class="num">${vOut(x.gal)}</td><td class="num">${tOut(x.tempF)}</td></tr>`).join("")
    + `<tr class="row"><td style="font-weight:600">Total into the HLT</td>
        <td class="num" style="font-weight:600">${vOut(tot)}</td><td></td></tr></tbody></table>`;
}
function calc(r){
  const eq=r.equipment||EQ_DEFAULT();
  const batch=num(eq.batchGal)||5, boilMin=num(eq.boilMin)||60;
  const post=Math.max(0.1,batch+num(eq.trubGal)+(r.hops||[]).filter(h=>h.use!=="Dry hop").reduce((a,h)=>a+num(h.oz),0)*num(eq.hopAbsorbGalOz));
  const pre=Math.max(0.1,post+num(eq.evapGalHr)*boilMin/60);
  const eff=(num(eq.effPct)||72)/100;
  let pts=0,mcu=0,grainLb=0;
  (r.fermentables||[]).forEach(f=>{
    const lb=num(f.lb); pts+=num(f.ppg)*lb*(f.kind==="grain"?eff:1);
    mcu+=lb*num(f.lovibond); if(f.kind==="grain") grainLb+=lb;
  });
  const og=1+pts/post/1000, preG=1+pts/pre/1000;
  const srm=1.4922*Math.pow(mcu/post,0.6859);
  const gBoil=(preG+og)/2, bigness=1.65*Math.pow(0.000125,gBoil-1);
  const hopFactor=(num(eq.hopUtilPct)||100)/100;
  let ibu=0, boilOz=0, dryOz=0;
  const hopIbu={};
  (r.hops||[]).forEach(h=>{
    const oz=num(h.oz), aa=num(h.aa)/100;
    if(h.use==="Dry hop") dryOz+=oz; else boilOz+=oz;
    if(!oz||!aa) return;
    /* Workbook method: form adjusts utilisation (pellet +10%, plug +5%, leaf none);
       a hop stand counts as half its stand time inside the Tinseth exponential. */
    const form=HOP_FORM_ADJ[h.form||"Pellet"]||1;
    const T=num(h.min);
    let util=0;
    if(h.use==="Dry hop") util=0;
    else if(h.use==="Whirlpool") util=bigness*(1-Math.exp(-0.04*0.5*T))/4.15*form;
    else if(h.use==="First wort") util=bigness*(1-Math.exp(-0.04*boilMin))/4.15*(form+0.10);
    else util=bigness*(1-Math.exp(-0.04*T))/4.15*form;
    const one=util*hopFactor*aa*oz*7490/post;
    hopIbu[h.id]=one; ibu+=one;
  });
  const atten=((r.yeasts&&r.yeasts[0]&&num(r.yeasts[0].atten))||75)/100;
  const fg=1+(og-1)*(1-atten), abv=(og-fg)*131.25;
  const calAl=1881.22*fg*(og-fg)/(1.775-og);
  const calCarb=3550*fg*(0.1808*og+0.8192*fg-1.0004);
  /* Diastatic power, °Lintner weighted across the grain bill (workbook legend: >=70 ample, 30-69 slow, <30 short). */
  let dpSum=0;
  (r.fermentables||[]).forEach(f=>{ if(f.kind==="grain") dpSum+=num(f.dp)*num(f.lb); });
  const dp=grainLb>0?dpSum/grainLb:0;
  const hopLossGal=boilOz*num(eq.hopAbsorbGalOz);
  const grainDispGal=grainLb*0.078125; /* 0.3125 qt per lb */
  const mp=mashPlan(r,grainLb);
  const mashGal=mp.mashWaterQt/4;
  const absorbGal=grainLb*num(eq.grainAbsorb||0.12);
  const runoff=Math.max(0,mashGal-absorbGal-num(eq.deadspaceGal));
  const sparge=Math.max(0,pre-runoff);
  const tunGal=num(eq.tunGal), tunFillGal=mashGal+grainDispGal;
  return {og,fg,abv,ibu,srm:isFinite(srm)?srm:0,preG,pre,post,batch,bu:og>1?ibu/((og-1)*1000):0,
    cal:Math.max(0,calAl+calCarb),hopIbu,grainLb,mashGal,absorbGal,runoff,sparge,mp,totalWater:mashGal+sparge,
    dp,boilOz,dryOz,hopLossGal,grainDispGal,tunGal,tunFillGal,
    tunOK: tunGal>0 ? tunFillGal<=tunGal : null};
}

/* ========================= state & storage ========================= */
let S={tab:"recipes",recipes:[],batches:[],inventory:[],equipProfiles:[],mashProfiles:[],tombs:{},sync:{provider:"none",clientId:"",lastAt:0,status:""},
  settings:{units:"us",theme:"dark"},openRecipe:null,openBatch:null};
const LS="wort:v2:", KEYS=["recipes","batches","inventory","equipProfiles","mashProfiles","settings","tombs","sync"];
let DB=null,UIDKEY=null,syncNote="Saved on this device.";
const docPath=k=>"data/users/"+UIDKEY+"/"+k;
function loadLocal(){
  KEYS.forEach(k=>{try{const raw=localStorage.getItem(LS+k);if(raw){const v=JSON.parse(raw);if(v!=null)S[k]=v;}}catch(e){}});
  // one-time migration from v1
  try{
    if(!S.recipes.length){
      const old=localStorage.getItem("wort:v1:recipes");
      if(old){ S.recipes=JSON.parse(old).map(migrate); localStorage.setItem(LS+"recipes",JSON.stringify(S.recipes)); }
      const ob=localStorage.getItem("wort:v1:batches"); if(ob&&!S.batches.length){S.batches=JSON.parse(ob);save("batches");}
      const oi=localStorage.getItem("wort:v1:inventory"); if(oi&&!S.inventory.length){S.inventory=JSON.parse(oi);save("inventory");}
    }
  }catch(e){}
  S.batches=(S.batches||[]).map(migrateBatch);
  if(!S.equipProfiles.length){ S.equipProfiles=EQ_SEED.map(p=>Object.assign({id:uid()},p)); save("equipProfiles"); }
  if(!S.mashProfiles.length){ S.mashProfiles=MASH_SEED.map(p=>Object.assign({id:uid()},JSON.parse(JSON.stringify(p)))); save("mashProfiles"); }
}
function migrateBatch(b){
  if(Object.isFrozen(b)||Object.isFrozen(b.recipe||{})) b=JSON.parse(JSON.stringify(b));
  if(b.recipe){ b.recipe=migrate(b.recipe); if(!b.session) b.session=SESSION_BLANK(); return b; }
  const base=(S.recipes||[]).find(x=>x.id===b.recipeId);
  const snap=base?JSON.parse(JSON.stringify(migrate(base))):BLANK();
  snap.id=uid(); snap.locked=false; if(b.name) snap.name=b.name;
  return Object.assign({},b,{recipe:snap,baseRecipeId:b.recipeId||null,baseRecipeName:base?base.name:"",session:b.session||SESSION_BLANK()});
}
function fill(r){
  if(!r) return r;
  if(!r.miscs) r.miscs=[];
  (r.hops||[]).forEach(h=>{ if(!h.form) h.form="Pellet"; });
  (r.fermentables||[]).forEach(f=>{ if(f.dp===undefined){
    const lib=FERM_LIB.find(x=>x[0]===f.name); f.dp=lib?lib[4]:(f.kind==="grain"?35:0); } });
  if(r.equipment){ if(r.equipment.hopAbsorbGalOz===undefined) r.equipment.hopAbsorbGalOz=0;
    if(r.equipment.tunGal===undefined) r.equipment.tunGal=0; }
  return r;
}
function migrate(r){
  if(Object.isFrozen(r)) r=JSON.parse(JSON.stringify(r));
  if(r.equipment&&r.mash) return fill(r);
  const eq=Object.assign(EQ_DEFAULT(),{name:"From earlier version",batchGal:num(r.batchGal)||5,boilMin:num(r.boilMin)||60,
    evapGalHr:num(r.evapGalHr),trubGal:num(r.trubGal),effPct:num(r.effPct)||72,deadspaceGal:0});
  const mash=Object.assign(MASH_DEFAULT(),{name:"From earlier version",grainTempF:num(r.grainTempF)||68,
    thickQtLb:num(r.mashThickQtLb)||1.33,
    steps:[{id:uid(),name:"Saccharification",type:"Infusion",tempF:num(r.mashTempF)||152,timeMin:60,rampMin:0}]});
  return fill(Object.assign({},r,{equipment:eq,mash:mash}));
}
const pending={};
function save(k){
  try{ stamp(k); }catch(e){}
  try{localStorage.setItem(LS+k,JSON.stringify(S[k]));}catch(e){}
  try{ if(S.tombs) localStorage.setItem(LS+"tombs",JSON.stringify(S.tombs)); }catch(e){}
  try{ syncSoon(); }catch(e){}
  if(!DB||!UIDKEY) return;
  clearTimeout(pending[k]);
  pending[k]=setTimeout(async()=>{ try{await DB.doc(docPath(k)).set({v:S[k]});}catch(e){} },700);
}
async function connect(){
  if(typeof claude==="undefined"||!claude.use) return;
  let db=null,user=null;
  try{[db,user]=await Promise.all([claude.use("db"),claude.use("user")]);}catch(e){return;}
  if(!db||!user) return;
  try{UIDKEY=await user.id();}catch(e){return;}
  DB=db; let got=false;
  for(const k of KEYS){
    try{ const snap=await DB.doc(docPath(k)).get();
      if(snap.exists){ const d=snap.data();
        /* The store freezes snapshots; every migration and edit below mutates, so copy. */
        if(d&&d.v!=null){ S[k]=JSON.parse(JSON.stringify(d.v)); got=true; } }
    }catch(e){}
  }
  syncNote="Synced to your account.";
  if(got){ S.recipes=(S.recipes||[]).map(migrate); S.batches=(S.batches||[]).map(migrateBatch); render(); } else { KEYS.forEach(save); paintSync(); }
}
/* "auto" follows the system; the CSS reads data-theme on the root. */
function paintTheme(){
  const t=(S.settings&&S.settings.theme)||"dark";
  const el=document.documentElement;
  if(t==="auto") el.removeAttribute("data-theme"); else el.setAttribute("data-theme",t);
}
/* A stale service worker will happily serve last month's app forever. This throws
   the cache away and reloads, which is the only reliable way back to current. */
async function forceUpdate(){
  flash("Checking for an update\u2026");
  try{
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
    if(window.caches){ const keys=await caches.keys(); await Promise.all(keys.map(k=>caches.delete(k))); }
  }catch(e){}
  location.reload(true);
}
function paintSync(){const e=document.getElementById("syncline"); if(e) e.textContent=syncNote;}
let flashT;
function flash(msg){
  const el=document.createElement("div"); el.className="flash"; el.textContent=msg;
  document.body.appendChild(el); clearTimeout(flashT); flashT=setTimeout(()=>el.remove(),2600);
}
async function saveFile(filename,text,mime){
  try{ if(typeof claude!=="undefined"&&claude.use){ const d=await claude.use("downloads");
    if(d){ await d.save({filename,data:text}); return; } } }catch(e){}
  const blob=new Blob([text],{type:mime||"application/xml"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

/* ========================= BeerXML ========================= */
const kid=(el,tag)=>{for(const c of el.children){if(c.tagName.toUpperCase()===tag) return c;} return null;};
const kidTxt=(el,tag,def)=>{const n=kid(el,tag); return n&&n.textContent.trim()!==""?n.textContent.trim():(def!==undefined?def:"");};
const kidNum=(el,tag,def)=>{const v=kidTxt(el,tag,""); const n=parseFloat(v); return isFinite(n)?n:(def||0);};
const kidsOf=(el,wrapTag,itemTag)=>{const w=kid(el,wrapTag); if(!w) return []; return [...w.children].filter(c=>c.tagName.toUpperCase()===itemTag);};
const HOP_USE_IN={"BOIL":"Boil","DRY HOP":"Dry hop","FIRST WORT":"First wort","AROMA":"Whirlpool","MASH":"Whirlpool","WHIRLPOOL":"Whirlpool"};
const HOP_USE_OUT={"Boil":"Boil","Dry hop":"Dry Hop","First wort":"First Wort","Whirlpool":"Aroma"};
const FERM_KIND_IN=t=>{t=(t||"").toLowerCase();
  if(t.indexOf("sugar")>-1) return "sugar"; if(t.indexOf("extract")>-1) return "extract"; return "grain";};
const FERM_KIND_OUT={grain:"Grain",extract:"Dry Extract",sugar:"Sugar"};

function importBeerXML(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.getElementsByTagName("parsererror").length) throw new Error("That file isn’t valid XML.");
  const nodes=[...doc.getElementsByTagName("RECIPE")];
  if(!nodes.length) throw new Error("No <RECIPE> found. Export from BeerSmith as BeerXML and try again.");
  return nodes.map(n=>{
    const r=BLANK();
    r.name=kidTxt(n,"NAME","Imported recipe");
    r.brewer=kidTxt(n,"BREWER","");
    const typ=kidTxt(n,"TYPE","All Grain");
    r.type = /extract/i.test(typ)?"Extract" : /partial/i.test(typ)?"Partial mash" : "All grain";
    const st=kid(n,"STYLE"); if(st) r.style=kidTxt(st,"NAME","");
    if(r.style&&!styleOf(r.style)){ const m=STYLES.find(s=>s[0].toLowerCase()===r.style.toLowerCase()); r.style=m?m[0]:""; }
    const batchL=kidNum(n,"BATCH_SIZE",19), boilL=kidNum(n,"BOIL_SIZE",0), boilT=kidNum(n,"BOIL_TIME",60);
    const eq=kid(n,"EQUIPMENT");
    const E=EQ_DEFAULT();
    E.name = eq?kidTxt(eq,"NAME","Imported equipment"):"Imported equipment";
    E.batchGal = batchL/U.galL;
    E.boilMin = boilT;
    E.effPct = kidNum(n,"EFFICIENCY",72);
    if(eq){
      E.trubGal = kidNum(eq,"TRUB_CHILLER_LOSS",0)/U.galL;
      E.deadspaceGal = kidNum(eq,"LAUTER_DEADSPACE",0)/U.galL;
      const hu=kidNum(eq,"HOP_UTILIZATION",100); if(hu>0) E.hopUtilPct=hu;
      const er=kidNum(eq,"EVAP_RATE",0), bs=kidNum(eq,"BOIL_SIZE",boilL);
      if(er>0&&bs>0) E.evapGalHr=(bs*er/100)/U.galL;
      else if(boilL>0) E.evapGalHr=Math.max(0,(boilL-batchL)/U.galL)/(boilT/60||1);
    } else if(boilL>0){ E.evapGalHr=Math.max(0,(boilL-batchL)/U.galL)/(boilT/60||1); }
    r.equipment=E;

    r.fermentables=kidsOf(n,"FERMENTABLES","FERMENTABLE").map(f=>({id:uid(),
      name:kidTxt(f,"NAME","Fermentable"), lb:kidNum(f,"AMOUNT",0)/U.lbKg,
      ppg:rnd(kidNum(f,"YIELD",75)*46.214/100,1), lovibond:kidNum(f,"COLOR",2),
      kind:FERM_KIND_IN(kidTxt(f,"TYPE","Grain"))}));
    r.hops=kidsOf(n,"HOPS","HOP").map(h=>({id:uid(),
      name:kidTxt(h,"NAME","Hop"), oz:kidNum(h,"AMOUNT",0)*U.kgOz, aa:kidNum(h,"ALPHA",0),
      use:HOP_USE_IN[kidTxt(h,"USE","Boil").toUpperCase()]||"Boil", min:kidNum(h,"TIME",0)}));
    r.yeasts=kidsOf(n,"YEASTS","YEAST").map(y=>({id:uid(),
      name:[kidTxt(y,"LABORATORY",""),kidTxt(y,"PRODUCT_ID",""),kidTxt(y,"NAME","Yeast")].filter(Boolean).join(" ").trim(),
      atten:kidNum(y,"ATTENUATION",75)}));

    const ms=kid(n,"MASH"), M=MASH_DEFAULT();
    if(ms){
      M.name=kidTxt(ms,"NAME","Imported mash");
      M.grainTempF=C2F(kidNum(ms,"GRAIN_TEMP",20));
      M.spargeTempF=C2F(kidNum(ms,"SPARGE_TEMP",75.6));
      const steps=kidsOf(ms,"MASH_STEPS","MASH_STEP");
      if(steps.length){
        M.steps=steps.map(s=>({id:uid(),name:kidTxt(s,"NAME","Step"),
          type:(kidTxt(s,"TYPE","Infusion").match(/decoction/i)?"Decoction":kidTxt(s,"TYPE","Infusion").match(/temperature/i)?"Temperature":"Infusion"),
          tempF:C2F(kidNum(s,"STEP_TEMP",67)), timeMin:kidNum(s,"STEP_TIME",60), rampMin:kidNum(s,"RAMP_TIME",0)}));
        const firstInf=kidNum(steps[0],"INFUSE_AMOUNT",0);
        const grainKg=r.fermentables.filter(f=>f.kind==="grain").reduce((a,f)=>a+f.lb*U.lbKg,0);
        if(firstInf>0&&grainKg>0) M.thickQtLb=rnd((firstInf/U.qtL)/(grainKg/U.lbKg),2);
      }
    }
    r.mash=M;
    /* BeerXML MISC AMOUNT is kg, or litres when AMOUNT_IS_WEIGHT is FALSE. */
    r.miscs=kidsOf(n,"MISCS","MISC").map(m=>{
      const wt=(kidTxt(m,"AMOUNT_IS_WEIGHT","TRUE")||"TRUE").toUpperCase()!=="FALSE";
      const u=kidTxt(m,"USE","Boil");
      const use=MISC_USES.find(z=>z.toLowerCase()===u.toLowerCase())||
        (/mash/i.test(u)?"Mash":/sparge/i.test(u)?"Sparge":/primary/i.test(u)?"Primary":
         /secondary/i.test(u)?"Secondary":/bottl/i.test(u)?"Bottling":"Boil");
      let amount=rnd(kidNum(m,"AMOUNT",0)*1000,2), unit=wt?"g":"ml";
      /* A chiller has no weight; BeerSmith stores a placeholder. Record it as one item. */
      const isKit=/chiller|hydrometer|thermometer|aerat|paddle|bag\b/i.test(kidTxt(m,"NAME",""));
      const da=(kidTxt(m,"DISPLAY_AMOUNT","")||"").match(/^\s*([\d.]+)\s*(g|ml|tsp|tbsp|oz|lb|ea)\s*$/i);
      if(da){ amount=parseFloat(da[1]); unit=da[2].toLowerCase(); }
      if(isKit){ amount=1; unit="ea"; }
      return {id:uid(), name:kidTxt(m,"NAME","Addition"), amount:amount,
        unit:unit, use:use, time:kidNum(m,"TIME",0), cat:kidTxt(m,"TYPE","")};
    });
    r.notes=kidTxt(n,"NOTES","");
    const dt=kidTxt(n,"DATE","");
    const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
    let iso="";
    const dm=dt.match(/^\s*(\d{1,2})\s+([A-Za-z]{3})[a-z]*\s+(\d{4})/);
    if(dm&&MON[dm[2].toLowerCase()]) iso=`${dm[3]}-${String(MON[dm[2].toLowerCase()]).padStart(2,"0")}-${dm[1].padStart(2,"0")}`;
    else { const d2=new Date(dt); if(dt&&!isNaN(d2)) iso=d2.toISOString().slice(0,10); }
    /* BeerSmith copies DATE from the recipe a brew was cloned from, so a date at the
       front of the name (YYMMDD) is the more reliable record of when it was actually brewed. */
    const nm=r.name.match(/^\s*(\d{2})(\d{2})(\d{2})\b/);
    if(nm){ const y=2000+(+nm[1]), mo=+nm[2], da=+nm[3];
      if(mo>=1&&mo<=12&&da>=1&&da<=31){
        const d3=new Date(Date.UTC(y,mo-1,da));
        if(d3.getUTCMonth()===mo-1&&d3.getUTCDate()===da) iso=d3.toISOString().slice(0,10); } }
    const og=kidNum(n,"OG",0), fg=kidNum(n,"FG",0);
    r._log={ og: og>1.002?rnd(og,3):"", fg: fg>0.98?rnd(fg,3):"", date: iso,
      taste: kidTxt(n,"TASTE_NOTES",""), rating: kidNum(n,"TASTE_RATING",0),
      bsEff: rnd(kidNum(n,"ACTUAL_EFFICIENCY",0),1),
      primaryDays: Math.round(kidNum(n,"PRIMARY_AGE",0)), primaryTempF: rnd(C2F(kidNum(n,"PRIMARY_TEMP",0)),0),
      secondaryDays: Math.round(kidNum(n,"SECONDARY_AGE",0)), secondaryTempF: rnd(C2F(kidNum(n,"SECONDARY_TEMP",0)),0),
      ageDays: Math.round(kidNum(n,"AGE",0)), carb: rnd(kidNum(n,"CARBONATION_USED",0)||kidNum(n,"CARBONATION",0),2) };
    return r;
  });
}
const X=(tag,val)=>`    <${tag}>${esc(val)}</${tag}>\n`;
function exportBeerXML(list){
  let out=`<?xml version="1.0" encoding="UTF-8"?>\n<RECIPES>\n`;
  list.forEach(r=>{
    const c=calc(r), eq=r.equipment||EQ_DEFAULT(), m=r.mash||MASH_DEFAULT();
    const st=styleOf(r.style);
    out+=`  <RECIPE>\n`;
    out+=X("NAME",r.name)+X("VERSION",1)+X("TYPE",r.type==="Extract"?"Extract":r.type==="Partial mash"?"Partial Mash":"All Grain");
    out+=X("BREWER",r.brewer||"Wort")+X("BATCH_SIZE",rnd(eq.batchGal*U.galL,3))+X("BOIL_SIZE",rnd(c.pre*U.galL,3));
    out+=X("BOIL_TIME",eq.boilMin)+X("EFFICIENCY",eq.effPct)+X("EST_OG",c.og.toFixed(3))+X("EST_FG",c.fg.toFixed(3));
    out+=X("IBU",rnd(c.ibu,1))+X("IBU_METHOD","Tinseth")+X("EST_COLOR",rnd(c.srm,1)+" SRM")+X("EST_ABV",rnd(c.abv,2));
    out+=X("CARBONATION",r.carbVols||2.4)+X("NOTES",r.notes||"")+X("DATE",new Date(r.created||Date.now()).toISOString().slice(0,10));
    out+=`    <STYLE>\n      <NAME>${esc(r.style||"Custom")}</NAME>\n      <VERSION>1</VERSION>\n      <CATEGORY>${esc(r.style||"Custom")}</CATEGORY>\n`+
      `      <CATEGORY_NUMBER>0</CATEGORY_NUMBER>\n      <STYLE_LETTER>A</STYLE_LETTER>\n      <STYLE_GUIDE>BJCP 2021</STYLE_GUIDE>\n`+
      `      <TYPE>Ale</TYPE>\n      <OG_MIN>${st?st[1]:1.030}</OG_MIN>\n      <OG_MAX>${st?st[2]:1.120}</OG_MAX>\n`+
      `      <FG_MIN>${st?st[3]:0.998}</FG_MIN>\n      <FG_MAX>${st?st[4]:1.040}</FG_MAX>\n`+
      `      <IBU_MIN>${st?st[5]:0}</IBU_MIN>\n      <IBU_MAX>${st?st[6]:120}</IBU_MAX>\n`+
      `      <COLOR_MIN>${st?st[7]:0}</COLOR_MIN>\n      <COLOR_MAX>${st?st[8]:50}</COLOR_MAX>\n`+
      `      <ABV_MIN>${st?st[9]:0}</ABV_MIN>\n      <ABV_MAX>${st?st[10]:15}</ABV_MAX>\n    </STYLE>\n`;
    out+=`    <EQUIPMENT>\n      <NAME>${esc(eq.name)}</NAME>\n      <VERSION>1</VERSION>\n`+
      `      <BATCH_SIZE>${rnd(eq.batchGal*U.galL,3)}</BATCH_SIZE>\n      <BOIL_SIZE>${rnd(c.pre*U.galL,3)}</BOIL_SIZE>\n`+
      `      <BOIL_TIME>${eq.boilMin}</BOIL_TIME>\n      <TUN_VOLUME>${rnd(eq.batchGal*U.galL*1.5,2)}</TUN_VOLUME>\n`+
      `      <TUN_WEIGHT>0</TUN_WEIGHT>\n      <TUN_SPECIFIC_HEAT>0.12</TUN_SPECIFIC_HEAT>\n`+
      `      <TRUB_CHILLER_LOSS>${rnd(num(eq.trubGal)*U.galL,3)}</TRUB_CHILLER_LOSS>\n`+
      `      <LAUTER_DEADSPACE>${rnd(num(eq.deadspaceGal)*U.galL,3)}</LAUTER_DEADSPACE>\n`+
      `      <TOP_UP_WATER>0</TOP_UP_WATER>\n      <TOP_UP_KETTLE>0</TOP_UP_KETTLE>\n`+
      `      <EVAP_RATE>${c.pre>0?rnd(num(eq.evapGalHr)/c.pre*100,2):0}</EVAP_RATE>\n`+
      `      <HOP_UTILIZATION>${eq.hopUtilPct||100}</HOP_UTILIZATION>\n      <CALC_BOIL_VOLUME>TRUE</CALC_BOIL_VOLUME>\n    </EQUIPMENT>\n`;
    out+=`    <FERMENTABLES>\n`+(r.fermentables||[]).map(f=>
      `      <FERMENTABLE>\n        <NAME>${esc(f.name)}</NAME>\n        <VERSION>1</VERSION>\n`+
      `        <TYPE>${FERM_KIND_OUT[f.kind]||"Grain"}</TYPE>\n        <AMOUNT>${rnd(num(f.lb)*U.lbKg,4)}</AMOUNT>\n`+
      `        <YIELD>${rnd(num(f.ppg)/46.214*100,2)}</YIELD>\n        <COLOR>${num(f.lovibond)}</COLOR>\n`+
      `        <ADD_AFTER_BOIL>FALSE</ADD_AFTER_BOIL>\n      </FERMENTABLE>\n`).join("")+`    </FERMENTABLES>\n`;
    out+=`    <HOPS>\n`+(r.hops||[]).map(h=>
      `      <HOP>\n        <NAME>${esc(h.name)}</NAME>\n        <VERSION>1</VERSION>\n`+
      `        <ALPHA>${num(h.aa)}</ALPHA>\n        <AMOUNT>${rnd(num(h.oz)/U.kgOz,5)}</AMOUNT>\n`+
      `        <USE>${HOP_USE_OUT[h.use]||"Boil"}</USE>\n        <TIME>${num(h.min)}</TIME>\n`+
      `        <FORM>Pellet</FORM>\n      </HOP>\n`).join("")+`    </HOPS>\n`;
    out+=`    <MISCS>\n`+(r.miscs||[]).map(x=>{
      const wt=x.unit!=="ml";
      const amt=["g","ml"].indexOf(x.unit)>-1 ? num(x.amount)/1000
              : x.unit==="oz" ? num(x.amount)*U.ozG/1000
              : x.unit==="lb" ? num(x.amount)*U.lbKg
              : num(x.amount)*0.005;
      return `      <MISC>\n        <NAME>${esc(x.name)}</NAME>\n        <VERSION>1</VERSION>\n`+
      `        <TYPE>${esc(x.cat||"Other")}</TYPE>\n        <USE>${esc(x.use)}</USE>\n`+
      `        <TIME>${num(x.time)}</TIME>\n        <AMOUNT>${rnd(amt,6)}</AMOUNT>\n`+
      `        <AMOUNT_IS_WEIGHT>${wt?"TRUE":"FALSE"}</AMOUNT_IS_WEIGHT>\n`+
      `        <DISPLAY_AMOUNT>${esc(num(x.amount)+" "+x.unit)}</DISPLAY_AMOUNT>\n      </MISC>\n`;
    }).join("")+`    </MISCS>\n    <WATERS></WATERS>\n`;
    out+=`    <YEASTS>\n`+(r.yeasts||[]).map(y=>
      `      <YEAST>\n        <NAME>${esc(y.name)}</NAME>\n        <VERSION>1</VERSION>\n        <TYPE>Ale</TYPE>\n`+
      `        <FORM>Dry</FORM>\n        <AMOUNT>0.011</AMOUNT>\n        <ATTENUATION>${num(y.atten)}</ATTENUATION>\n      </YEAST>\n`).join("")+`    </YEASTS>\n`;
    const plan=c.mp.rows;
    out+=`    <MASH>\n      <NAME>${esc(m.name)}</NAME>\n      <VERSION>1</VERSION>\n`+
      `      <GRAIN_TEMP>${rnd(F2C(num(m.grainTempF)),2)}</GRAIN_TEMP>\n      <SPARGE_TEMP>${rnd(F2C(num(m.spargeTempF)),2)}</SPARGE_TEMP>\n`+
      `      <PH>5.4</PH>\n      <MASH_STEPS>\n`+
      plan.map(p=>`        <MASH_STEP>\n          <NAME>${esc(p.step.name)}</NAME>\n          <VERSION>1</VERSION>\n`+
      `          <TYPE>${p.step.type}</TYPE>\n          <STEP_TEMP>${rnd(F2C(num(p.step.tempF)),2)}</STEP_TEMP>\n`+
      `          <STEP_TIME>${num(p.step.timeMin)}</STEP_TIME>\n          <RAMP_TIME>${num(p.step.rampMin)}</RAMP_TIME>\n`+
      `          <INFUSE_AMOUNT>${rnd(p.infuseQt*U.qtL,3)}</INFUSE_AMOUNT>\n        </MASH_STEP>\n`).join("")+
      `      </MASH_STEPS>\n    </MASH>\n`;
    out+=`  </RECIPE>\n`;
  });
  return out+`</RECIPES>\n`;
}

function activeRecipe(){

/* A deep copy with fresh row ids, so editing the copy can never reach back into the original. */
function snapshot(r){
  const c=JSON.parse(JSON.stringify(r));
  c.id=uid(); c.locked=false; c.created=Date.now();
  c.fermentables=(c.fermentables||[]).map(x=>Object.assign({},x,{id:uid()}));
  c.hops=(c.hops||[]).map(x=>Object.assign({},x,{id:uid()}));
  c.yeasts=(c.yeasts||[]).map(x=>Object.assign({},x,{id:uid()}));
  if(c.mash) c.mash.steps=(c.mash.steps||[]).map(x=>Object.assign({},x,{id:uid()}));
  return c;
}

  if(L.primaryTempF) se.primaryTempF=L.primaryTempF;
  if(L.secondaryDays) se.secondaryDays=L.secondaryDays;
  if(L.secondaryTempF) se.secondaryTempF=L.secondaryTempF;
  if(L.ageDays) se.ageDays=L.ageDays;
  if(L.bsEff) se.bsEff=L.bsEff;
  let packaged="";
  if(L.date&&(L.primaryDays||L.secondaryDays)){
    const d=new Date(L.date+"T12:00:00");

    status: L.fg?"Packaged" : L.og?"Fermenting" : "Planned",
    brewDate:L.date||"", packagedDate:packaged,

}

          <label class="fld"><span>Infusion water (${tLbl()})${(r.mash.steps||[]).length>1?"":" — unused"}</span><input type="number" step="1" data-m="infuseTempF" data-conv="t" value="${tOut(m.infuseTempF||212)}"></label>
          <label class="fld"><span>Sparge temp (${tLbl()})</span><input type="number" step="1" data-m="spargeTempF" data-conv="t" value="${tOut(m.spargeTempF)}"></label>

/* A recipe opens as something to read, not a form. Edit is one tap away. */
function sumRow(label,value,muted){
  return `<div style="display:flex;gap:12px;padding:5px 0;border-top:1px solid var(--line)">
    <span style="flex:1;min-width:0">${label}</span><span class="${muted?"muted":""}">${value}</span></div>`;
}
function recipeOverview(r){
  const c=calc(r), L=!!r.locked, m=r.mash||MASH_DEFAULT(), eq=r.equipment||EQ_DEFAULT();
  const totLb=(r.fermentables||[]).reduce((a,f)=>a+num(f.lb),0)||1;
  const brews=S.batches.filter(b=>b.baseRecipeId===r.id&&!(b.parentBatchId&&S.batches.some(x=>x.id===b.parentBatchId)));
  const grain=(r.fermentables||[]).map(f=>`<div style="padding:7px 0;border-top:1px solid var(--line)">

        <span>${wOut(f.lb)} ${wLbl()}</span>
        <span class="muted small" style="width:34px;text-align:right">${Math.round(num(f.lb)/totLb*100)}%</span></div>
      <div style="height:5px;margin-top:5px;background:var(--surface-2);border-radius:3px;overflow:hidden">
        <div style="width:${Math.round(num(f.lb)/totLb*100)}%;height:100%;background:var(--accent)"></div></div>
    </div>`).join("")||`<p class="muted small" style="margin:4px 0">Nothing yet.</p>`;
  const hops=(r.hops||[]).map(h=>`<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line);align-items:baseline">

      <span>${hOut(h.oz)} ${hLbl()}</span>
      <span class="muted small" style="width:92px;text-align:right">${esc(h.use)}${h.use==="Dry hop"?"":" · "+num(h.min)+" min"}</span>
      <span class="small" style="width:40px;text-align:right">${(c.hopIbu[h.id]||0).toFixed(1)}</span>
    </div>`).join("")||`<p class="muted small" style="margin:4px 0">No hops.</p>`;
  const misc=(r.miscs||[]).map(x=>`<div style="display:flex;gap:10px;padding:6px 0;border-top:1px solid var(--line)">

    <div class="panel"><div class="panel-head">

function gauge(label,val,lo,hi,fmt,unit){
  const v=isFinite(val)?val:0; let inner,range="";
  if(lo!=null){
    const a=Math.min(lo,v), b=Math.max(hi,v);
    const pad=Math.max((b-a)*0.3,(hi-lo)*0.35,1e-9)||1;
    const d0=a-pad,d1=b+pad,w=d1-d0||1;
    const out=v<lo||v>hi;
    inner=`<div class="track"><div class="band" style="left:${(lo-d0)/w*100}%;width:${(hi-lo)/w*100}%"></div>
      <div class="tick${out?" out":""}" style="left:${Math.max(0,Math.min(100,(v-d0)/w*100))}%"></div></div>`;
    range=`${fmt(lo)}–${fmt(hi)}`;
  } else inner=`<div class="track"></div>`;
  return `<div class="gauge"><div class="gauge-top"><span class="gauge-label">${label}</span>
    <span class="gauge-val">${fmt(v)}</span><span class="gauge-range">${unit||""}</span></div>
    ${inner}${range?`<div class="gauge-range" style="margin-top:4px">in style: ${range}</div>`:""}</div>`;
}
function refreshStats(){
  const r=activeRecipe(); if(!r) return;
  const c=calc(r), st=styleOf(r.style);
  const g3=v=>v.toFixed(3),g1=v=>v.toFixed(1),g0=v=>String(Math.round(v));
  document.getElementById("stats").innerHTML=
    `<div class="beerbar" style="background:${srmColor(c.srm)}"><span>SRM ${c.srm.toFixed(1)}</span><span>${esc(r.style||"no style")}</span></div>
     <div style="margin-top:12px">
     ${gauge("Original gravity",c.og,st&&st[1],st&&st[2],g3)}
     ${gauge("Final gravity",c.fg,st&&st[3],st&&st[4],g3)}
     ${gauge("Alcohol",c.abv,st&&st[9],st&&st[10],g1,"% ABV")}
     ${gauge("Bitterness",c.ibu,st&&st[5],st&&st[6],g0,"IBU")}
     ${gauge("Colour",c.srm,st&&st[7],st&&st[8],g1,"SRM")}</div>
     <dl class="kv" style="margin-top:12px;border-top:1px solid var(--line);padding-top:10px">
       <dt>Bitterness ratio</dt><dd>${c.bu.toFixed(2)} BU:GU</dd>
       <dt>Pre-boil</dt><dd>${vOut(c.pre)} ${vLbl()} @ ${c.preG.toFixed(3)}</dd>
       <dt>Total water</dt><dd>${vOut(c.totalWater)} ${vLbl()}</dd>
       <dt>Calories</dt><dd>${Math.round(c.cal)} per 12 oz</dd>
       ${c.grainLb>0?`<dt>Diastatic power</dt><dd style="color:${c.dp>=70?"var(--ok)":c.dp>=30?"var(--ink)":"var(--warn)"}">${Math.round(c.dp)} \u00b0L</dd>`:""}
       ${c.tunOK===null?"":`<dt>Mash tun fit</dt><dd style="color:${c.tunOK?"var(--ok)":"var(--warn)"}">${vOut(c.tunFillGal)} of ${vOut(c.tunGal)} ${vLbl()}</dd>`}
       </dl>
       ${c.grainLb>0&&c.dp<30?`<div class="note" style="color:var(--warn)">Diastatic power under 30 \u00b0Lintner \u2014 this grain bill may not fully convert on its own.</div>`:""}`;
  const totLb=r.fermentables.reduce((s,f)=>s+num(f.lb),0);
  const gb=document.getElementById("grainbill"); if(gb) gb.textContent=`${wOut(totLb)} ${wLbl()} total`;
  r.fermentables.forEach(f=>{const cell=document.querySelector(`[data-pct="${f.id}"]`);
    if(cell) cell.textContent=totLb>0?Math.round(num(f.lb)/totLb*100):0;});
  (r.hops||[]).forEach(h=>{
    const cell=document.querySelector(`[data-ibu="${h.id}"]`); if(!cell) return;
    cell.textContent=(c.hopIbu[h.id]||0).toFixed(1);
  });
  c.mp.rows.forEach(p=>{
    const cell=document.querySelector(`[data-step="${p.step.id}"]`); if(!cell) return;
    const amt=p.infuseQt>0?(isMetric()?rnd(p.infuseQt*U.qtL,1)+" L":rnd(p.infuseQt/4,2)+" gal")+" · ":"";
    cell.textContent=amt+p.note;
  });
  const hl=document.getElementById("hlt");
  if(hl) hl.innerHTML=hltTable(r,c);
  const mk=document.getElementById("mashkv");
  if(mk) mk.innerHTML = c.grainLb>0 ? `
    <dt>Mash water</dt><dd>${vOut(c.mashGal)} ${vLbl()}</dd>
    <dt>− Grain absorption</dt><dd>${vOut(c.absorbGal)} ${vLbl()}</dd>
    <dt>− Tun deadspace</dt><dd>${vOut(num((r.equipment||{}).deadspaceGal))} ${vLbl()}</dd>
    <dt>First runnings</dt><dd>${vOut(c.runoff)} ${vLbl()}</dd>
    <dt>Sparge water at ${tOut(r.mash.spargeTempF)} ${tLbl()}</dt><dd>${vOut(c.sparge)} ${vLbl()}</dd>
    <dt>Total water</dt><dd>${vOut(c.totalWater)} ${vLbl()}</dd>` :
    `<dt>Mash water</dt><dd class="muted">add mashable grain first</dd>`;
  const sh=document.getElementById("shop"); if(sh) sh.innerHTML=shortfall(r);
}
function shortNeeds(r){
  const need=[];
  (r.fermentables||[]).forEach(f=>need.push({cat:"Fermentable",name:f.name,qty:num(f.lb),u:"lb"}));
  (r.hops||[]).forEach(h=>need.push({cat:"Hop",name:h.name,qty:num(h.oz),u:"oz"}));
  (r.yeasts||[]).forEach(y=>need.push({cat:"Yeast",name:y.name,qty:1,u:"pkg"}));
  (r.miscs||[]).forEach(m=>need.push({cat:"Other",name:m.name,qty:num(m.amount),u:m.unit}));
  return need.filter(n=>String(n.name||"").trim()!=="").map(n=>{
    const m=stockFor(n.name,n.cat), have=m?num(m.row.qty):0;
    const short=n.qty-have;
    return Object.assign({},n,{have,short,matched:m?m.row.name:null,how:m?m.how:null});
  });
}
function shortText(n){
  return n.u==="lb" ? `${wOut(Math.abs(n.short))} ${wLbl()}`
       : n.u==="oz" ? `${hOut(Math.abs(n.short))} ${hLbl()}`
       : `${rnd(Math.abs(n.short),2)} ${n.u}`;
}
function shortfall(r){
  const need=shortNeeds(r);
  if(!need.length) return `<span class="muted">Add ingredients to compare with your stock.</span>`;
  const missing=need.filter(n=>n.short>0.001);
  const rows=need.map(n=>{
    const ok=n.short<=0.001;
    return `<div style="display:flex;gap:8px;align-items:center;padding:4px 0">
      <span style="flex:1;min-width:0">${esc(n.name)}${
        n.matched&&n.how==="near"?`<span class="small muted" style="display:block">matched to ${esc(n.matched)}</span>`:""}</span>
      <span style="color:${ok?"var(--ok)":"var(--warn)"};white-space:nowrap">${ok?"ok":"short "+shortText(n)}</span>
      ${ok?"":`<button class="btn btn-quiet btn-sm" data-stock="${esc(n.cat)}|${esc(n.name)}|${rnd(n.short,3)}|${esc(n.u)}" title="Add to inventory">+</button>`}
    </div>`;
  }).join("");
  return rows + (missing.length?`<div class="inline" style="margin-top:10px">
      <button class="btn btn-sm fix" data-act="stock-all">Add all ${missing.length} to stock</button>
      <button class="btn btn-sm fix" data-act="shop-list">Shopping list</button></div>`
    :`<div class="note" style="color:var(--ok)">Everything on hand.</div>`);
}

function splitTabs(b){
  const pid=b.parentBatchId||b.id;
  const parent=S.batches.find(x=>x.id===pid);
  if(!parent) return "";
  const kids=S.batches.filter(x=>x.parentBatchId===pid);
  if(!kids.length) return "";
  const tab=(x,label)=>`<button class="tab" data-goto="${x.id}" aria-current="${x.id===b.id}">${esc(label)}</button>`;
  return `<div class="panel-head" style="padding-top:10px;padding-bottom:10px">
    <nav class="tabs" style="flex:1">${tab(parent,"Whole batch")}${
      kids.map(k=>tab(k,k.splitLabel||k.name)).join("")}</nav>
    <span class="small muted">${kids.length} parts, one wort</span></div>`;
}

function daysBetween(a,b){
  if(!a) return "–";
  const d1=new Date(a), d2=b?new Date(b):new Date();
  if(isNaN(d1)) return "–";
  return Math.max(0,Math.round((d2-d1)/86400000));
}
function batchSummary(){
  const b=curB(); const kv=document.querySelector(".readout .kv"); if(!b||!kv) return;
  const abv=(b.actualOG&&b.actualFG)?((num(b.actualOG)-num(b.actualFG))*131.25):null;
  const att=(b.actualOG&&b.actualFG)?(1-(num(b.actualFG)-1)/(num(b.actualOG)-1))*100:null;
  const cards=document.getElementById("b-cards");
  if(cards) cards.innerHTML=
    `<div style="border:1px solid var(--line);border-radius:8px;padding:11px">
       <p class="muted" style="margin:0;font-size:12px">Alcohol</p>
       <p style="margin:2px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;letter-spacing:-0.03em">${abv!=null?abv.toFixed(1)+"%":"–"}</p></div>
     <div style="border:1px solid var(--line);border-radius:8px;padding:11px">
       <p class="muted" style="margin:0;font-size:12px">Attenuation</p>
       <p style="margin:2px 0 0;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:25px;letter-spacing:-0.03em">${att!=null?att.toFixed(0)+"%":"–"}</p></div>`;
  kv.innerHTML=`<dt>OG vs target</dt><dd>${(b.targetOG&&b.actualOG)?((num(b.actualOG)-num(b.targetOG))>=0?"+":"")+rnd((num(b.actualOG)-num(b.targetOG))*1000,0)+" pts":"–"}</dd>
    <dt>Days fermenting</dt><dd>${daysBetween(b.brewDate,b.packagedDate)}</dd>`;
}
function drawFermChart(){
  batchSummary();
  const b=curB(), host=document.getElementById("fermchart"); if(!b||!host) return;
  const pts=(b.readings||[]).filter(r=>r.date&&num(r.sg)>0).sort((x,y)=>x.date.localeCompare(y.date));
  if(pts.length<2){host.innerHTML=`<p class="muted small" style="margin:0">Two or more readings draw the curve.</p>`;return;}
  const W=560,H=190,P={l:48,r:44,t:14,b:26};
  const t0=new Date(pts[0].date).getTime(), t1=new Date(pts[pts.length-1].date).getTime(), span=Math.max(1,t1-t0);
  const sgs=pts.map(p=>num(p.sg)), smin=Math.min(...sgs)-0.002, smax=Math.max(...sgs)+0.002;
  const temps=pts.filter(p=>p.tempF!==""&&p.tempF!=null).map(p=>num(p.tempF));
  const tmin=temps.length?Math.min(...temps)-3:60, tmax=temps.length?Math.max(...temps)+3:75;
  const X2=t=>P.l+(t-t0)/span*(W-P.l-P.r);
  const Ys=v=>P.t+(smax-v)/(smax-smin||1)*(H-P.t-P.b);
  const Yt=v=>P.t+(tmax-v)/(tmax-tmin||1)*(H-P.t-P.b);
  const line=pts.map((p,i)=>(i?"L":"M")+X2(new Date(p.date).getTime()).toFixed(1)+" "+Ys(num(p.sg)).toFixed(1)).join(" ");

/* ===================== matching stock to recipes ===================== */
/* Library names carry maltster and region ("Pale Malt: Brewers Malt, 2-row (Briess)",
   "Cascade (U.S.)"), but people stock "2-row" and "Cascade". Normalise both sides
   before comparing, then fall back to prefix and token tests. */
function normName(s){
  return String(s||"").toLowerCase()
    .replace(/[\u2122\u00ae]/g,"")
    .replace(/^[^:]{2,28}:\s*/,"")        /* "Pale Malt: Brewers Malt" -> "Brewers Malt" */
    .replace(/\([^)]*\)/g," ")            /* drop "(Briess)", "(U.S.)" */
    .replace(/[^a-z0-9]+/g," ")
    .replace(/\bcaramel\b/g,"crystal")    /* the one synonym worth hard-coding */
    .replace(/\b(\d+)\s*l\b/g,"$1")      /* "60L" and "60" are the same malt */
    .trim();
}
function tokens(s){ return normName(s).split(" ").filter(Boolean); }
const INV_LIST={Fermentable:"dl-ferm",Hop:"dl-hop",Yeast:"dl-yeast",Other:"dl-misc"};
const INV_UNIT=()=>({Fermentable:wLbl(),Hop:hLbl(),Yeast:"pkg",Other:"g"});
/* Which library a recipe line should be shopped against. */
function stockFor(name,cat){
  const want=normName(name);
  if(!want) return null;
  /* A "Crystal" hop and a "Crystal 60L" malt share a word but not a shelf. */
  const pool=cat?S.inventory.filter(i=>i.cat===cat):S.inventory;
  const score=i=>{
    const have=normName(i.name);
    if(!have) return 0;
    if(have===want) return 3;
    if(have.length>=3&&want.length>=3&&(have.indexOf(want)>-1||want.indexOf(have)>-1)) return 2;
    const a=tokens(i.name), b=tokens(name);
    const short=a.length<=b.length?a:b, long=a.length<=b.length?b:a;
    if(!short.length) return 0;
    const all=short.every(t=>t.length>=2&&long.indexOf(t)>-1);
    const meaty=short.some(t=>t.length>=3);
    return (all&&meaty)?1:0;
  };
  let best=null, bestScore=0;
  pool.forEach(i=>{ const sc=score(i); if(sc>bestScore){ bestScore=sc; best=i; } });
  return best?{row:best,how:bestScore===3?"exact":"near"}:null;
}
function libMeta(cat,name){
  if(cat==="Fermentable"){ const f=FERM_LIB.find(x=>x[0]===name);
    return f?`${f[1]} PPG · ${f[2]} °L${f[4]?" · DP "+f[4]:""}`:""; }
  if(cat==="Hop"){ const h=HOP_LIB.find(x=>x[0]===name);
    return h?`${h[1]}% AA${h[2]?" · subs "+h[2]:""}`:""; }
  if(cat==="Yeast"){ const y=YEAST_LIB.find(x=>x[0]===name);
    return y?`${y[2]||""} · ${y[1]}% att${y[4]?" · "+y[4]+"–"+y[5]+" °F":""}`.replace(/^ · /,""):""; }
  const m=MISC_LIB.find(x=>x[0]===name);
  return m?`${m[5]} · ${m[3]}`:"";
}

function doSplit(){
  const b=curB(); if(!b) return;
  const kids=S.splitRows.map(p=>{
    const f=num(p.pct)/100, snap=snapshot(b.recipe), eq=snap.equipment;
    ["batchGal","trubGal","deadspaceGal","evapGalHr","tunGal"].forEach(k=>eq[k]=rnd(num(eq[k])*f,4));
    (snap.fermentables||[]).forEach(x=>x.lb=rnd(num(x.lb)*f,4));
    (snap.hops||[]).forEach(x=>x.oz=rnd(num(x.oz)*f,4));
    (snap.miscs||[]).forEach(x=>x.amount=rnd(num(x.amount)*f,3));
    return {id:uid(), parentBatchId:b.id, splitLabel:p.name, share:f,
      baseRecipeId:b.baseRecipeId||null, baseRecipeName:b.baseRecipeName||"", recipe:snap,
      name:b.name+" \u2014 "+p.name, status:(b.status==="Planned"||b.status==="Split")?"Fermenting":b.status,
      brewDate:b.brewDate, targetOG:b.targetOG, actualOG:b.actualOG, actualFG:"", packagedDate:"",
      srm:b.srm, readings:[], notes:"",
      session:JSON.parse(JSON.stringify(b.session||SESSION_BLANK()))};
  });
  kids.forEach(k=>S.batches.push(k));
  b.splitInto=kids.map(k=>k.id);
  b.status="Split";
  save("batches");
  S.splitRows=null; S.openBatch=kids[0].id;
  document.getElementById("dlg").close();
  flash(`Split into ${kids.length}. Dry hops and additions are now independent.`);
  render();
}


/* ===================== sync ===================== */
/* OneDrive stores one JSON file, so merging is ours to do. Every record carries the
   time it last changed; deletions leave a dated tombstone behind. Merging then means
   taking the newer of each pair by id, and honouring a tombstone newer than the record
   it refers to. Nothing is overwritten wholesale, so two devices can both have worked
   offline and neither loses anything but the field the other changed later. */
const APP_VERSION="3.2.1";
const SYNC_KEYS=["recipes","batches","inventory","equipProfiles","mashProfiles"];

/* A record is compared ignoring _u, with keys in a fixed order, so a trip through
   JSON and back is not mistaken for a change. */
function stable(v){
  if(v===undefined) return "\u0000";
  if(v===null||typeof v!=="object") return JSON.stringify(v);
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>k!=="_u").sort()
    .map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
}
const isObj=v=>!!v&&typeof v==="object"&&!Array.isArray(v);
const idArr=a=>Array.isArray(a)&&a.every(x=>isObj(x)&&x.id!=null);

/* BASE is the copy as it stood at the last successful sync: the common ancestor.
   Keeping it is what lets a merge tell "I changed this" apart from "they did". */
let BASE={};
function loadBase(){ try{ BASE=JSON.parse(localStorage.getItem(LS+"base")||"{}")||{}; }catch(e){ BASE={}; } }
function rebase(){
  BASE={};
  SYNC_KEYS.forEach(k=>{ const m={};
    (S[k]||[]).forEach(r=>{ if(r&&r.id) m[r.id]=JSON.parse(JSON.stringify(r)); });
    BASE[k]=m; });
  try{ localStorage.setItem(LS+"base",JSON.stringify(BASE)); }catch(e){}
}
const reshadow=rebase;

/* Three-way merge. Where only one side moved away from the ancestor, that side wins.
   Where both moved, objects merge key by key and lists of identified rows merge row by
   row, so a reading added here and a note added there both survive. Only a genuine
   clash on the same leaf falls back to whichever record was saved later. */
function merge3(b,l,r,lNew){
  const sl=stable(l), sr=stable(r);
  if(sl===sr) return l;
  const sb=stable(b);
  if(sb===sl) return r;
  if(sb===sr) return l;
  if(isObj(l)&&isObj(r)){
    const out={}, keys=Object.keys(l).concat(Object.keys(r).filter(k=>!(k in l)));
    keys.forEach(k=>{
      const hasB=isObj(b)&&(k in b);
      let v;
      if((k in l)&&(k in r)) v=merge3(hasB?b[k]:undefined,l[k],r[k],lNew);
      else if(k in l) v=(hasB&&stable(b[k])===stable(l[k]))?undefined:l[k];
      else v=(hasB&&stable(b[k])===stable(r[k]))?undefined:r[k];
      if(v!==undefined) out[k]=v;
    });
    return out;
  }
  if(idArr(l)&&idArr(r)){
    const bm={}; (Array.isArray(b)?b:[]).forEach(x=>{ if(isObj(x)&&x.id!=null) bm[x.id]=x; });
    const lm={}, rm={};
    l.forEach(x=>lm[x.id]=x); r.forEach(x=>rm[x.id]=x);
    const order=l.map(x=>x.id).concat(r.map(x=>x.id).filter(id=>!(id in lm)));
    const out=[], seen={};
    order.forEach(id=>{
      if(seen[id]) return; seen[id]=1;
      const B=bm[id], L=lm[id], R=rm[id];
      if(L&&R) out.push(merge3(B,L,R,lNew));
      else if(L){ if(B&&stable(B)===stable(L)) return; out.push(L); }   /* removed on the other side */
      else if(R){ if(B&&stable(B)===stable(R)) return; out.push(R); }
    });
    return out;
  }
  return lNew?l:r;
}

function stamp(k){
  if(SYNC_KEYS.indexOf(k)<0) return;
  const arr=S[k]||[], now=Date.now(), base=BASE[k]||{}, seen={};
  arr.forEach(r=>{
    if(!r||typeof r!=="object") return;
    if(!r.id) r.id=uid();
    seen[r.id]=1;
    const b=base[r.id];
    if(!b||stable(b)!==stable(r)) r._u=now;
    else if(!r._u) r._u=b._u||now;
  });
  S.tombs=S.tombs||{}; S.tombs[k]=S.tombs[k]||{};
  Object.keys(base).forEach(id=>{ if(!seen[id]) S.tombs[k][id]=now; });
  Object.keys(seen).forEach(id=>{ if(S.tombs[k][id]) delete S.tombs[k][id]; });
}

function mergeList(key,local,remote,tombs){
  const base=BASE[key]||{}, lm={}, rm={};
  (local||[]).forEach(x=>{ if(x&&x.id) lm[x.id]=x; });
  (remote||[]).forEach(x=>{ if(x&&x.id) rm[x.id]=x; });
  const ids=Object.keys(lm).concat(Object.keys(rm).filter(id=>!(id in lm)));
  const out=[];
  ids.forEach(id=>{
    const L=lm[id], R=rm[id];
    let rec = (L&&R) ? merge3(base[id],L,R,((L._u||0)>=(R._u||0))) : (L||R);
    if(!rec) return;
    rec._u=Math.max((L&&L._u)||0,(R&&R._u)||0)||Date.now();
    if(!((tombs||{})[id]>rec._u)) out.push(rec);
  });
  return out;
}
function mergeDoc(remote){
  const rt=(remote&&remote.tombs)||{}, out={changed:false};
  S.tombs=S.tombs||{};
  SYNC_KEYS.forEach(k=>{
    const t=Object.assign({},rt[k]||{});
    Object.keys(S.tombs[k]||{}).forEach(id=>{ t[id]=Math.max(t[id]||0,S.tombs[k][id]); });
    const before=stable(S[k]||[]);
    const merged=mergeList(k, S[k]||[], (remote&&remote.data&&remote.data[k])||[], t);
    S[k]=merged; S.tombs[k]=t;
    if(before!==stable(merged)) out.changed=true;
  });
  return out;
}
function syncDoc(){
  const data={}; SYNC_KEYS.forEach(k=>data[k]=S[k]||[]);
  return {v:2, app:"wort", savedAt:Date.now(), data:data, tombs:S.tombs||{}};
}

let ADAPTER=null, SYNCING=false;
function syncStatus(msg){ S.sync=S.sync||{}; S.sync.status=msg; paintSyncLine(); }
function paintSyncLine(){
  const e=document.getElementById("syncline");
  if(e) e.textContent=(S.sync&&S.sync.status)||syncNote;
  const d=document.getElementById("sync-state"); if(d) d.textContent=(S.sync&&S.sync.status)||"";
}
async function doSync(reason){
  if(!ADAPTER||!ADAPTER.signedIn()){ syncStatus("Not connected."); return false; }
  if(SYNCING) return false;
  SYNCING=true;
  try{
    syncStatus("Syncing…");
    SYNC_KEYS.forEach(stamp);
    const remote=await ADAPTER.get();
    const r=mergeDoc(remote);
    await ADAPTER.put(syncDoc());
    reshadow();
    SYNC_KEYS.forEach(k=>{ try{ localStorage.setItem(LS+k,JSON.stringify(S[k])); }catch(e){} });
    try{ localStorage.setItem(LS+"tombs",JSON.stringify(S.tombs)); }catch(e){}
    S.sync.lastAt=Date.now();
    try{ localStorage.setItem(LS+"sync",JSON.stringify(S.sync)); }catch(e){}
    syncStatus("Synced "+new Date(S.sync.lastAt).toLocaleTimeString());
    if(r.changed) render();
    return true;
  }catch(e){
    syncStatus("Sync failed: "+(e&&e.message?e.message:e));
    return false;
  } finally { SYNCING=false; }
}

/* ---------- OneDrive ---------- */
/* Authorisation code flow with PKCE, which is what a browser app without a secret
   is meant to use. The file lives in the app's own folder, so the scope asks for
   nothing beyond what this app created. */
/* "common" needs a multi-tenant registration. A single-tenant app has to sign in
   through its own directory id instead. */
const odTenant=()=>((S.sync&&S.sync.tenant)||"common").trim()||"common";
const odAuth=()=>"https://login.microsoftonline.com/"+encodeURIComponent(odTenant())+"/oauth2/v2.0/";
const OD_SCOPE="Files.ReadWrite.AppFolder offline_access User.Read";
const OD_FILE="https://graph.microsoft.com/v1.0/me/drive/special/approot:/wort-data.json:/content";
const odTok=()=>{ try{ return JSON.parse(localStorage.getItem(LS+"odtok")||"null"); }catch(e){ return null; } };
const odSet=t=>{ try{ t?localStorage.setItem(LS+"odtok",JSON.stringify(t)):localStorage.removeItem(LS+"odtok"); }catch(e){} };
const redirectUri=()=>location.origin+location.pathname;
function b64url(buf){ return btoa(String.fromCharCode.apply(null,new Uint8Array(buf)))
  .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function pkce(){
  const a=new Uint8Array(64); crypto.getRandomValues(a);
  const verifier=b64url(a.buffer).slice(0,96);
  const hash=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(verifier));
  return {verifier, challenge:b64url(hash)};
}
async function odSignIn(){
  const cid=(S.sync&&S.sync.clientId||"").trim();
  if(!cid){ flash("Paste your application (client) ID first."); return; }
  const p=await pkce();
  sessionStorage.setItem(LS+"pkce",p.verifier);
  sessionStorage.setItem(LS+"cid",cid);
  location.href=odAuth()+"authorize?client_id="+encodeURIComponent(cid)
    +"&response_type=code&redirect_uri="+encodeURIComponent(redirectUri())
    +"&response_mode=query&scope="+encodeURIComponent(OD_SCOPE)
    +"&code_challenge="+p.challenge+"&code_challenge_method=S256";
}
async function odExchange(code){
  const cid=sessionStorage.getItem(LS+"cid")||(S.sync&&S.sync.clientId)||"";
  const ver=sessionStorage.getItem(LS+"pkce")||"";
  const body=new URLSearchParams({client_id:cid,grant_type:"authorization_code",code:code,
    redirect_uri:redirectUri(),code_verifier:ver});
  const r=await fetch(odAuth()+"token",{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error_description||j.error||"sign-in failed");
  odSet({access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in-120)*1000,cid:cid,ten:odTenant()});
  sessionStorage.removeItem(LS+"pkce");
}
async function odToken(){
  let t=odTok();
  if(!t) throw new Error("not signed in");
  if(Date.now()<t.exp) return t.access;
  const body=new URLSearchParams({client_id:t.cid,grant_type:"refresh_token",
    refresh_token:t.refresh,scope:OD_SCOPE});
  const r=await fetch(odAuth()+"token",{method:"POST",
    headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body});
  const j=await r.json();
  if(!r.ok){ odSet(null); throw new Error("sign-in expired, connect again"); }
  t={access:j.access_token,refresh:j.refresh_token||t.refresh,exp:Date.now()+(j.expires_in-120)*1000,cid:t.cid,ten:t.ten};
  odSet(t); return t.access;
}
const OneDrive={
  name:"OneDrive",
  signedIn:()=>!!odTok(),
  signIn:odSignIn,
  signOut(){ odSet(null); S.sync.provider="none"; save("settings"); syncStatus("Disconnected."); render(); },
  async get(){
    const tk=await odToken();
    const r=await fetch(OD_FILE,{headers:{Authorization:"Bearer "+tk}});
    if(r.status===404) return null;
    if(!r.ok) throw new Error("read failed ("+r.status+")");
    return await r.json();
  },
  async put(doc){
    const tk=await odToken();
    const r=await fetch(OD_FILE,{method:"PUT",
      headers:{Authorization:"Bearer "+tk,"Content-Type":"application/json"},
      body:JSON.stringify(doc)});
    if(!r.ok) throw new Error("write failed ("+r.status+")");
  }
};
function pickAdapter(){
  ADAPTER = (S.sync&&S.sync.provider==="onedrive") ? OneDrive : null;
}
async function syncBoot(){
  try{
    const q=new URLSearchParams(location.search);
    if(q.get("code")){
      await odExchange(q.get("code"));
      S.sync=S.sync||{}; S.sync.provider="onedrive";
      S.sync.clientId=sessionStorage.getItem(LS+"cid")||S.sync.clientId;
      save("settings"); try{localStorage.setItem(LS+"sync",JSON.stringify(S.sync));}catch(e){}
      history.replaceState({},"",redirectUri());
      pickAdapter(); flash("Connected to OneDrive."); await doSync("boot"); render(); return;
    }
    if(q.get("error")){ history.replaceState({},"",redirectUri());
      syncStatus("Sign-in cancelled: "+(q.get("error_description")||q.get("error"))); }
  }catch(e){ syncStatus("Sign-in failed: "+(e&&e.message?e.message:e)); history.replaceState({},"",redirectUri()); }
  pickAdapter();
  if(ADAPTER&&ADAPTER.signedIn()) doSync("boot");
}

function restoreDoc(doc){
  if(!doc||!doc.data) throw new Error("that file is not a Wort backup");
  const t=Object.assign({},doc.tombs||{});
  SYNC_KEYS.forEach(k=>{
    const tk=Object.assign({},(t[k]||{}),(S.tombs&&S.tombs[k])||{});
    S[k]=mergeList(k, S[k]||[], doc.data[k]||[], tk);
    S.tombs=S.tombs||{}; S.tombs[k]=tk;
    save(k);
  });
  rebase();
}

/* ===================== brew session ===================== */
/* What actually happened on the day, beside what the recipe predicted.
   Gravity samples are corrected for temperature before anything is derived from them. */
const SESSION_BLANK=()=>({calTempF:60,primaryDays:'',primaryTempF:'',secondaryDays:'',secondaryTempF:'',ageDays:'',bsEff:'',strikeTempF:"",mashInTempF:"",mashOutTempF:"",
  firstRunSG:"",preBoilGal:"",preBoilSG:"",preBoilTempF:"",postBoilGal:"",intoFermGal:"",
  ogTempF:"",pitchTempF:"",pitchedAt:"",log:[]});
const hydCorr=T=>1.00130346-1.34722124e-4*T+2.04052596e-6*T*T-2.32820948e-9*T*T*T;
function corrSG(sg,sampleF,calF){
  sg=num(sg); if(!sg) return 0;
  const t=num(sampleF), c=num(calF)||60;
  if(!t) return sg;
  return sg*hydCorr(t)/hydCorr(c);
}
function sessionCalc(b){
  const r=b.recipe||BLANK(), se=b.session||SESSION_BLANK(), c=calc(r);
  /* Maximum points the grain bill could ever give, i.e. 100% extraction. */
  let maxPts=0;
  (r.fermentables||[]).forEach(f=>maxPts+=num(f.ppg)*num(f.lb));
  const preSG=corrSG(se.preBoilSG,se.preBoilTempF,se.calTempF);
  const og=corrSG(b.actualOG,se.ogTempF,se.calTempF);
  const preGal=num(se.preBoilGal), postGal=num(se.postBoilGal);
  const fermGal=num(se.intoFermGal)||postGal||num((r.equipment||{}).batchGal);
  /* Three different efficiencies, measured at three different points:
     mash  = sugar in the kettle before the boil
     kettle = sugar at post-boil volume -- this is the one the recipe model uses
     brewhouse = sugar that actually reached the fermenter, after losses */
  const mashEff   = (maxPts>0&&preSG>1&&preGal>0) ? (preSG-1)*1000*preGal/maxPts*100 : null;
  const kettleEff = (maxPts>0&&og>1&&postGal>0)   ? (og-1)*1000*postGal/maxPts*100   : null;
  const bhEff     = (maxPts>0&&og>1&&fermGal>0)   ? (og-1)*1000*fermGal/maxPts*100   : null;
  const boilHr  = (num((r.equipment||{}).boilMin)||60)/60;
  const evap    = (preGal>0&&postGal>0) ? (preGal-postGal)/boilHr : null;
  return {c,maxPts,preSG,og,preGal,postGal,fermGal,mashEff,kettleEff,bhEff,evap,
    preDelta: preSG>1 ? (preSG-c.preG)*1000 : null,
    ogDelta:  og>1    ? (og-c.og)*1000      : null,
    volDelta: preGal>0 ? preGal-c.pre       : null};
}

      <dl class="kv" id="se-out" style="margin-top:14px;border-top:1px solid var(--line);padding-top:10px"></dl>
      <h3 class="subhead" style="margin-top:16px">Timed log</h3>

function paintSession(){
  const b=curB(); const out=document.getElementById("se-out"); if(!b||!out) return;
  const s2=sessionCalc(b), eq=(b.recipe||{}).equipment||EQ_DEFAULT(), se2=b.session||SESSION_BLANK();
  const sgn=v=>(v>=0?"+":"")+v.toFixed(0);
  const row=(k,v)=>`<dt>${k}</dt><dd>${v}</dd>`;
  out.innerHTML=
    (s2.preSG>1?row("Pre-boil, corrected",`${s2.preSG.toFixed(3)}${s2.preDelta!=null?` <span class="muted">(${sgn(s2.preDelta)} pts vs plan)</span>`:""}`):"")
   +(s2.og>1?row("OG, corrected",`${s2.og.toFixed(3)}${s2.ogDelta!=null?` <span class="muted">(${sgn(s2.ogDelta)} pts)</span>`:""}`):"")
   +(s2.volDelta!=null?row("Pre-boil volume",`${vOut(s2.preGal)} ${vLbl()} <span class="muted">(${(s2.volDelta>=0?"+":"")+rnd(vOut(s2.volDelta),2)})</span>`):"")
   +(s2.mashEff!=null?row("Mash efficiency",`<b>${s2.mashEff.toFixed(1)}%</b> <span class="muted">into the kettle</span>`):"")
   +(s2.kettleEff!=null?row("Kettle efficiency",`<b>${s2.kettleEff.toFixed(1)}%</b> <span class="muted">(recipe uses ${rnd(num(eq.effPct),1)}%)</span>`):"")
   +(s2.bhEff!=null?row("Brewhouse efficiency",`<b>${s2.bhEff.toFixed(1)}%</b> <span class="muted">into the fermenter</span>`):"")
   +(se2.bsEff?row("Efficiency on record",`${se2.bsEff}% <span class="muted">as imported</span>`):"")
   +(se2.primaryDays?row("Primary",`${se2.primaryDays} days at ${tOut(num(se2.primaryTempF))} ${tLbl()}`):"")
   +(se2.secondaryDays?row("Secondary",`${se2.secondaryDays} days at ${tOut(num(se2.secondaryTempF))} ${tLbl()}`):"")
   +(se2.ageDays?row("Conditioned",`${se2.ageDays} days`):"")
   +(s2.evap!=null?row("Actual boil-off",`${vOut(s2.evap)} ${vLbl()}/hr <span class="muted">(profile ${vOut(num(eq.evapGalHr))})</span>`):"")
   || `<dt class="muted">Fill in a gravity and a volume and the efficiencies work themselves out.</dt><dd></dd>`;
}

/* ===================== brew-day timer ===================== */
/* Phases come from the recipe itself: each mash step, then the boil with its
   hop and misc additions, then any whirlpool stand. Elapsed time is measured
   from wall-clock stamps, so a sleeping phone or a reloaded page stays honest. */
let TIMER=null, TWAKE=null;
const TLS="wort:v2:timer";
function loadTimer(){ try{const r=localStorage.getItem(TLS); if(r) TIMER=JSON.parse(r);}catch(e){} }
function saveTimer(){ try{ TIMER?localStorage.setItem(TLS,JSON.stringify(TIMER)):localStorage.removeItem(TLS); }catch(e){} }
function buildPhases(r){
  const eq=r.equipment||EQ_DEFAULT(), m=r.mash||MASH_DEFAULT(), out=[];
  const c=calc(r);
  (m.steps||[]).forEach((st,i)=>{
    const p=c.mp.rows[i];
    const next=c.mp.rows[i+1];
    const ahead = next&&next.infuseQt>0.001
      ? ` · next: heat ${vOut(next.infuseQt/4)} ${vLbl()} to ${tOut(next.waterF)} ${tLbl()}`
      : (i===(m.steps||[]).length-1&&c.sparge>0.001
          ? ` · next: heat ${vOut(c.sparge)} ${vLbl()} of sparge to ${tOut(num(m.spargeTempF))} ${tLbl()}` : "");
    out.push({kind:"mash", name:st.name||("Mash step "+(i+1)), mins:num(st.timeMin),
      tempF:num(st.tempF), hint:(p?p.note:"")+ahead, adds:[]});
  });
  const boilMin=num(eq.boilMin)||60, adds=[];
  (r.hops||[]).forEach(h=>{
    if(h.use==="Boil") adds.push({at:Math.min(num(h.min),boilMin), what:`${hOut(h.oz)} ${hLbl()} ${h.name||"hop"}`});
    else if(h.use==="First wort") adds.push({at:boilMin, what:`${hOut(h.oz)} ${hLbl()} ${h.name||"hop"} (first wort)`});
  });
  (r.miscs||[]).forEach(x=>{ if(x.use==="Boil")
    adds.push({at:Math.min(num(x.time),boilMin), what:`${num(x.amount)} ${x.unit} ${x.name||"addition"}`}); });
  adds.sort((a,b)=>b.at-a.at).forEach((a,i)=>a.id="a"+i);
  out.push({kind:"boil", name:"Boil", mins:boilMin, tempF:212, hint:"", adds});
  const wh=[], whTimes=[];
  (r.hops||[]).forEach(h=>{ if(h.use==="Whirlpool"){ wh.push(`${hOut(h.oz)} ${hLbl()} ${h.name||"hop"}`); whTimes.push(num(h.min)); }});
  (r.miscs||[]).forEach(x=>{ if(x.use==="Whirlpool"){ wh.push(`${num(x.amount)} ${x.unit} ${x.name||"addition"}`); whTimes.push(num(x.time)); }});
  if(wh.length){ const mx=Math.max.apply(null,whTimes)||15;
    out.push({kind:"whirlpool", name:"Whirlpool / hop stand", mins:mx, tempF:null,
      hint:"everything goes in at the start", adds:wh.map((w,i)=>({at:mx, what:w, id:"w"+i}))}); }
  return out.filter(p=>p.mins>0||p.adds.length);
}
function startTimer(src,id,r){
  TIMER={src,id,title:r.name,phases:buildPhases(r),idx:0,startedAt:0,acc:0,running:false,fired:[]};
  if(!TIMER.phases.length){ TIMER=null; flash("This recipe has no timed steps yet."); return; }
  saveTimer(); nav(()=>{S.timerOpen=true;});
}
const tPhase=()=>TIMER&&TIMER.phases[TIMER.idx];
function tElapsed(){ if(!TIMER) return 0;
  return TIMER.acc + (TIMER.running? Date.now()-TIMER.startedAt : 0); }
function tRemain(){ const p=tPhase(); return p? p.mins*60000-tElapsed() : 0; }
function fmtMS(ms){ const neg=ms<0; ms=Math.abs(ms);
  const t=Math.floor(ms/1000), h=Math.floor(t/3600), m=Math.floor(t%3600/60), s2=t%60;
  return (neg?"+":"")+(h?h+":"+String(m).padStart(2,"0"):String(m))+":"+String(s2).padStart(2,"0"); }
let AC=null;
function beep(n){
  try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<(n||1);i++){ const o=AC.createOscillator(), g=AC.createGain();
      o.connect(g); g.connect(AC.destination); o.frequency.value=880; o.type="sine";
      const t0=AC.currentTime+i*0.32;
      g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      o.start(t0); o.stop(t0+0.3); } }catch(e){}
}
async function keepAwake(on){
  try{ if(on&&!TWAKE&&navigator.wakeLock) TWAKE=await navigator.wakeLock.request("screen");
       else if(!on&&TWAKE){ TWAKE.release(); TWAKE=null; } }catch(e){}
}
function timerView(){
  if(!TIMER) return `<div class="panel"><div class="empty"><p>No timer running.</p>
    <button class="btn btn-primary" data-act="t-close">Back</button></div></div>`;
  const p=tPhase();
  return `<div class="panel">
    <div class="panel-head"><button class="btn btn-quiet" data-act="t-close">\u2039 Back</button>
      <h2 style="margin-left:6px">${esc(TIMER.title)}</h2>
      <button class="btn btn-sm" data-act="t-reset">Reset</button></div>
    <div class="panel-body">
      <div id="t-face"></div>
      <div class="inline" style="margin-top:14px">
        <button class="btn btn-primary fix" data-act="t-play" id="t-play" style="flex:1 1 140px">Start</button>
        <button class="btn fix" data-act="t-prev">\u2039 Step</button>
        <button class="btn fix" data-act="t-next">Step \u203a</button>
        <button class="btn fix" data-act="t-plus">+1 min</button>
      </div>
      <div class="inline" style="margin-top:14px"><input id="t-note" placeholder="Note this moment\u2026" style="flex:1 1 200px">
        <button class="btn fix" data-act="t-log">Log</button></div>
      <div id="t-adds" style="margin-top:14px"></div>
      <div id="t-sched" style="margin-top:14px"></div>
      <div class="note">Times run from the clock, so locking the phone or reloading this page will not drift the countdown.</div>
    </div></div><div class="syncline" id="syncline"></div>`;
}
function paintTimer(){
  if(!TIMER||!S.timerOpen) return;
  const face=document.getElementById("t-face"); if(!face) return;
  const p=tPhase(), rem=tRemain(), over=rem<0;
  face.innerHTML=`<div class="small muted">Step ${TIMER.idx+1} of ${TIMER.phases.length} \u00b7 ${esc(p.name)}${
      p.tempF?" \u00b7 "+tOut(p.tempF)+" "+tLbl():""}</div>
    <div class="tclock" style="color:${over?"var(--warn)":"var(--ink)"}">${fmtMS(rem)}</div>
    <div class="small muted">${over?"over by":"left of"} ${p.mins} min${p.hint?" \u00b7 "+esc(p.hint):""}</div>
    <div class="tbar"><div class="tbar-fill" style="width:${Math.max(0,Math.min(100,(1-rem/(p.mins*60000||1))*100))}%"></div></div>`;
  const pb=document.getElementById("t-play"); if(pb) pb.textContent=TIMER.running?"Pause":(tElapsed()>0?"Resume":"Start");
  const ad=document.getElementById("t-adds");
  if(ad){
    if(!p.adds.length) ad.innerHTML=`<div class="small muted">No additions in this step.</div>`;
    else ad.innerHTML=p.adds.map(a=>{
      const due=rem<=a.at*60000, done=TIMER.fired.indexOf(TIMER.idx+":"+a.id)>-1;
      return `<div class="addrow${due?" due":""}"><span style="flex:1;min-width:0">${esc(a.what)}</span>
        <span class="muted">${due?(done?"added":"NOW"):"at "+a.at+" min \u00b7 in "+fmtMS(rem-a.at*60000)}</span>
        <button class="btn btn-quiet btn-sm" data-tick="${a.id}">${done?"\u21ba":"\u2713"}</button></div>`;
    }).join("");
  }
  const sc=document.getElementById("t-sched");
  if(sc) sc.innerHTML=TIMER.phases.map((x,i)=>
    `<div class="addrow${i===TIMER.idx?" due":""}" style="opacity:${i<TIMER.idx?0.5:1}">
      <span style="flex:1;min-width:0">${esc(x.name)}</span>
      <span class="muted">${x.mins} min${x.tempF?" \u00b7 "+tOut(x.tempF)+" "+tLbl():""}</span></div>`).join("");
}
function tick(){
  if(!TIMER||!TIMER.running) return;
  const p=tPhase(), rem=tRemain();
  (p.adds||[]).forEach(a=>{
    const key=TIMER.idx+":"+a.id;
    if(rem<=a.at*60000 && TIMER.fired.indexOf(key)<0){ TIMER.fired.push(key); saveTimer(); beep(2); }
  });
  const endKey=TIMER.idx+":end";
  if(rem<=0 && TIMER.fired.indexOf(endKey)<0){ TIMER.fired.push(endKey); saveTimer(); beep(3); }
  paintTimer();
  const dc=document.getElementById("d-clock"); if(dc) dc.textContent=fmtMS(tRemain());
}
setInterval(tick,500);
function tGoto(i){
  if(!TIMER) return;
  TIMER.idx=Math.max(0,Math.min(TIMER.phases.length-1,i));
  TIMER.acc=0; TIMER.startedAt=Date.now();
  saveTimer(); paintTimer();
}

    if(s2.kettleEff==null&&s2.evap==null){ flash("Record a gravity and the volumes first."); return; }
    if(s2.kettleEff!=null) eq.effPct=rnd(s2.kettleEff,1);
    if(s2.evap!=null&&s2.evap>0) eq.evapGalHr=rnd(s2.evap,3);
    save("batches"); flash("Equipment updated from what you measured."); render(); }
  else if(a==="split"&&b){ if(b.parentBatchId){ flash("This is already one part of a split."); return; }
    if((b.splitInto||[]).length){ flash("This batch is already split."); return; }
    S.splitRows=null; splitDialog(); }
  else if(a==="sp-add"){ S.splitRows.push({name:"Part "+String.fromCharCode(65+S.splitRows.length),pct:0});
    const even=rnd(100/S.splitRows.length,1); S.splitRows.forEach(x=>x.pct=even);
    if(S.splitDraw) S.splitDraw(); }
  else if(a==="sp-cancel"){ S.splitRows=null; document.getElementById("dlg").close(); }
  else if(a==="sp-go"){ doSplit(); }
  else if(a==="t-log"&&TIMER){ const inp=document.getElementById("t-note");
    const txt=(inp&&inp.value||"").trim(); if(!txt) return;
    const tb=S.batches.find(x=>x.id===TIMER.id);
    if(!tb){ flash("Open this as a batch to keep a session log."); return; }
    tb.session=tb.session||SESSION_BLANK(); tb.session.log=tb.session.log||[];
    const p=tPhase();
    tb.session.log.push({id:uid(),at:new Date().toISOString().slice(0,16),
      text:txt+" \u2014 "+p.name+", "+fmtMS(tRemain())+" left"});
    inp.value=""; save("batches"); flash("Logged to the brew session."); }
  else if(a==="timer"&&r){ startTimer(activeKey(), S.tab==="batches"?b.id:base.id, r); }
  else if(a==="t-close"){ nav(()=>{S.timerOpen=false; keepAwake(false);}); }
  else if(a==="t-play"&&TIMER){
    if(TIMER.running){ TIMER.acc=tElapsed(); TIMER.running=false; keepAwake(false); }
    else { TIMER.startedAt=Date.now(); TIMER.running=true; beep(1); keepAwake(true); }
    saveTimer(); paintTimer(); }
  else if(a==="t-next"&&TIMER){ tGoto(TIMER.idx+1); }
  else if(a==="t-prev"&&TIMER){ tGoto(TIMER.idx-1); }
  else if(a==="t-plus"&&TIMER){ TIMER.phases[TIMER.idx].mins+=1; saveTimer(); paintTimer(); }
  else if(a==="t-reset"&&TIMER){ confirmBox("Clear brew day","The running timer and its ticked-off additions are discarded. Your batch and its log are untouched.","Clear",
      ()=>{ TIMER=null; saveTimer(); keepAwake(false); nav(()=>{S.timerOpen=false;}); }); }
  else if(a==="sync-in"){ const box=document.getElementById("cidbox"), tb=document.getElementById("tenbox");
    S.sync=S.sync||{}; S.sync.clientId=(box&&box.value||"").trim();
    S.sync.tenant=(tb&&tb.value||"common").trim()||"common";
    try{localStorage.setItem(LS+"sync",JSON.stringify(S.sync));}catch(e){}
    odSignIn(); }
  else if(a==="sync-out"){ OneDrive.signOut(); }
  else if(a==="bk-save"){ SYNC_KEYS.forEach(stamp);
    saveFile("wort-backup-"+new Date().toISOString().slice(0,10)+".json",
      JSON.stringify(backupDoc(),null,1),"application/json"); flash("Backup written."); }
  else if(a==="bk-load"){ S.importTo="backup"; filein.click(); }
  else if(a==="sync-now"){ doSync("manual"); }
  else if(a==="stock-all"&&r){
    const miss=shortNeeds(r).filter(n=>n.short>0.001);
    miss.forEach(n=>addToStock(n.cat,n.name,n.short,n.u));
    flash(`${miss.length} added to stock.`); render(); }
  else if(a==="shop-list"&&r){
    const miss=shortNeeds(r).filter(n=>n.short>0.001);
    if(!miss.length){ flash("Nothing short."); return; }
    const lines=["Shopping list — "+r.name,new Date().toISOString().slice(0,10),""];
    ["Fermentable","Hop","Yeast","Other"].forEach(c=>{
      const g=miss.filter(n=>n.cat===c); if(!g.length) return;
      lines.push(c+"s"); g.forEach(n=>lines.push("  "+shortText(n).padEnd(12)+" "+n.name)); lines.push("");
    });
    saveFile(slug(r.name)+"-shopping-list.txt",lines.join("\n"),"text/plain");
    flash("Shopping list written."); }
  else if(a==="add-x"&&r){r.miscs.push({id:uid(),name:"",amount:1,unit:"g",use:"Boil",time:15,cat:""});save(K);
    document.getElementById("tbl-x").innerHTML=miscTable(r);refreshStats();}
  else if(a==="add-step"&&r){const last=r.mash.steps[r.mash.steps.length-1];
    r.mash.steps.push({id:uid(),name:"Step "+(r.mash.steps.length+1),type:"Infusion",
      tempF:last?Math.min(170,num(last.tempF)+10):152,timeMin:20,rampMin:0});
    save(K);document.getElementById("tbl-m").innerHTML=mashTable(r);refreshStats();}
  else if(a==="save-eq"&&r){const p=Object.assign({id:uid()},JSON.parse(JSON.stringify(r.equipment)));
    S.equipProfiles.push(p);save("equipProfiles");flash("Equipment profile saved.");}
  else if(a==="save-mash"&&r){const p=Object.assign({id:uid()},JSON.parse(JSON.stringify(r.mash)));
    S.mashProfiles.push(p);save("mashProfiles");flash("Mash profile saved.");}
  else if(a==="new-eq"){S.equipProfiles.push(Object.assign({id:uid()},EQ_DEFAULT(),{name:"New equipment profile"}));save("equipProfiles");render();}
  else if(a==="new-mash"){S.mashProfiles.push(Object.assign({id:uid()},JSON.parse(JSON.stringify(MASH_DEFAULT())),{name:"New mash profile"}));save("mashProfiles");render();}
  else if(a==="new-batch"){ newBatchFrom(null,"New batch"); }
  else if(a==="del-batch"&&b){ const id=b.id, nm=b.name;
    confirmBox("Delete batch","“"+nm+"” and its brew session, readings and notes will be removed.","Delete",
      ()=>{ S.batches=S.batches.filter(x=>x.id!==id); save("batches"); nav(()=>{S.openBatch=null;}); }); }
  else if(a==="add-reading"&&b){b.readings=b.readings||[];
    b.readings.push({id:uid(),date:new Date().toISOString().slice(0,10),sg:"",tempF:"",note:""});save("batches");render();}
}
function conv(el,raw){
  const c=el.dataset.conv;
  if(c==="w") return wIn(raw); if(c==="h") return hIn(raw); if(c==="v") return vIn(raw);
  if(c==="t") return tIn(raw); if(c==="thick") return thickIn(raw);
  if(c==="absorb") return isMetric()?raw*U.lbKg/U.galL:raw;
  if(c==="hopabs") return isMetric()?raw*U.ozG/U.galL:raw;
  return raw;
}
app.addEventListener("input",e=>{
  const el=e.target, r=activeRecipe(), b=curB(), K=activeKey();
  if(isLocked()&&(el.dataset.p||el.dataset.e||el.dataset.m||el.dataset.s)) return;
  if(el.hasAttribute("data-loadeq")){
    const p=S.equipProfiles.find(x=>x.id===el.value); if(p&&r){
      r.equipment=JSON.parse(JSON.stringify(p)); delete r.equipment.id; save(K); render(); } return; }
  if(el.hasAttribute("data-loadmash")){
    const p=S.mashProfiles.find(x=>x.id===el.value); if(p&&r){
      r.mash=JSON.parse(JSON.stringify(p)); delete r.mash.id;
      r.mash.steps=r.mash.steps.map(s=>Object.assign({},s,{id:uid()})); save(K); render(); } return; }
  if(el.dataset.p&&r){
    const parts=el.dataset.p.split(":");
    if(parts.length===1){ r[parts[0]]=(el.type==="number")?conv(el,num(el.value)):el.value; }
    else{
      const key={f:"fermentables",h:"hops",y:"yeasts"}[parts[0]];
      const row=r[key].find(x=>x.id===parts[1]); if(!row) return;
      if(parts[2]==="name"){
        row.name=el.value;
        const lib=parts[0]==="f"?FERM_LIB.find(x=>x[0]===el.value):parts[0]==="h"?HOP_LIB.find(x=>x[0]===el.value):YEAST_LIB.find(x=>x[0]===el.value);
        if(lib){ const setF=(p,v)=>{const n=document.querySelector('[data-p="'+p+'"]'); if(n) n.value=v;};
          if(parts[0]==="f"){row.ppg=lib[1];row.lovibond=lib[2];row.kind=lib[3];row.dp=lib[4]||0;
            setF("f:"+row.id+":ppg",row.ppg);setF("f:"+row.id+":lovibond",row.lovibond);setF("f:"+row.id+":kind",row.kind);}
          else if(parts[0]==="h"){row.aa=lib[1];setF("h:"+row.id+":aa",row.aa);}
          else {row.atten=lib[1];setF("y:"+row.id+":atten",row.atten);} }
      } else row[parts[2]]=(el.type==="number")?conv(el,num(el.value)):el.value;
    }
    save(K); refreshStats(); return;
  }
  if(el.dataset.e&&r){ const k=el.dataset.e;
    r.equipment[k]=(el.type==="number")?conv(el,num(el.value)):el.value; save(K); refreshStats(); return; }
  if(el.dataset.m&&r){ const k=el.dataset.m;
    r.mash[k]=(el.type==="number")?conv(el,num(el.value)):el.value; save(K); refreshStats(); return; }
  if(el.dataset.x&&r){ const[id,f]=el.dataset.x.split(":");
    const x=r.miscs.find(z=>z.id===id); if(!x) return;
    if(f==="name"){ x.name=el.value;
      const lib=MISC_LIB.find(z=>z[0]===el.value);
      if(lib){ x.amount=lib[1]; x.unit=lib[2]; x.use=lib[3]; x.time=lib[4]; x.cat=lib[5];
        const set=(k,v)=>{const n=document.querySelector('[data-x="'+id+':'+k+'"]'); if(n) n.value=v;};
        set("amount",x.amount); set("unit",x.unit); set("use",x.use); set("time",x.time); set("cat",x.cat); }
    } else x[f]=(el.type==="number")?num(el.value):el.value;
    save(K); refreshStats(); return; }
  if(el.dataset.s&&r){ const[id,f]=el.dataset.s.split(":");
    const st=r.mash.steps.find(x=>x.id===id); if(!st) return;
    st[f]=(el.type==="number")?conv(el,num(el.value)):el.value; save(K); refreshStats(); return; }
  if(el.dataset.b&&b){ b[el.dataset.b]=el.value; save("batches"); batchSummary(); paintSession(); return; }
  if(el.dataset.se&&b){ b.session=b.session||SESSION_BLANK();
    const cv=el.dataset.sconv;
    b.session[el.dataset.se]= el.value==="" ? "" :
      (cv==="v"?vIn(num(el.value)) : cv==="t"?tIn(num(el.value)) : (el.type==="number"?num(el.value):el.value));
    save("batches"); paintSession(); return; }
  if(el.dataset.sp){ const[i,f]=el.dataset.sp.split(":");
    S.splitRows[+i][f]= f==="pct"?num(el.value):el.value;
    if(f==="pct"&&S.splitDraw) S.splitDraw();
    return; }
  if(el.dataset.r&&b){ const[id,f]=el.dataset.r.split(":"); const row=b.readings.find(x=>x.id===id); if(!row) return;
    row[f]=f==="tempF"?(el.value===""?"":tIn(num(el.value))):el.value; save("batches"); drawFermChart(); return; }
  if(el.id==="rec-q"||el.id==="bat-q"){
    const id=el.id, sel=el.selectionStart;
    if(id==="rec-q") S.recQ=el.value; else S.batQ=el.value;
    render();
    const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(sel,sel); }catch(e){} }
    return; }
  if(el.id==="inv-q"){ S.invQ=el.value; const sel=el.selectionStart; render();
    const n=document.getElementById("inv-q"); if(n){ n.focus(); try{ n.setSelectionRange(sel,sel); }catch(e){} } return; }
  if(el.dataset.i){ const[id,f]=el.dataset.i.split(":"); const row=S.inventory.find(x=>x.id===id); if(!row) return;
    if(f==="name"){
      row.name=el.value;
      /* Picking a library name brings its unit with it, and the row grows a reference line. */
      const inLib = (row.cat==="Fermentable"?FERM_LIB:row.cat==="Hop"?HOP_LIB:row.cat==="Yeast"?YEAST_LIB:MISC_LIB)
        .some(x=>x[0]===el.value);
      if(inLib){ if(row.cat==="Other"){ const m=MISC_LIB.find(x=>x[0]===el.value); if(m) row.unit=m[2]; }
        else row.unit=INV_UNIT()[row.cat];
        save("inventory"); render(); return; }
    } else row[f]=f==="qty"?num(el.value):el.value;
    save("inventory"); return; }
  if(el.dataset.ep){ const[id,f]=el.dataset.ep.split(":"); const p=S.equipProfiles.find(x=>x.id===id); if(!p) return;
    p[f]=(el.type==="number")?conv(el,num(el.value)):el.value; save("equipProfiles"); return; }
  if(el.dataset.mp){ const[id,f]=el.dataset.mp.split(":"); const p=S.mashProfiles.find(x=>x.id===id); if(!p) return;
    p[f]=(el.type==="number")?conv(el,num(el.value)):el.value; save("mashProfiles"); return; }
  if(el.dataset.mps){ const[pid,sid,f]=el.dataset.mps.split(":");
    const p=S.mashProfiles.find(x=>x.id===pid); if(!p) return;
    const st=(p.steps||[]).find(x=>x.id===sid); if(!st) return;
    st[f]=(el.type==="number")?conv(el,num(el.value)):el.value; save("mashProfiles"); return; }
  if(el.dataset.t){ runAllTools(); return; }
});

/* ========================= boot ========================= */
document.getElementById("dl-ferm").innerHTML=FERM_LIB.map(f=>`<option value="${esc(f[0])}">`).join("");
document.getElementById("dl-hop").innerHTML=HOP_LIB.map(f=>`<option value="${esc(f[0])}">`).join("");
document.getElementById("dl-yeast").innerHTML=YEAST_LIB.map(f=>`<option value="${esc(f[0])}">`).join("");
document.getElementById("dl-misc").innerHTML=MISC_LIB.map(f=>`<option value="${esc(f[0])}">`).join("");
loadLocal();
loadBase();
if(!Object.keys(BASE).length) rebase();
loadTimer();
if(!S.settings||!S.settings.units) S.settings={units:"us",theme:"dark"};
if(!S.settings.theme) S.settings.theme="dark";
paintTheme();
S.recipes=(S.recipes||[]).map(migrate);
S.batches=(S.batches||[]).map(migrateBatch);
render();
connect();
syncBoot();
try{ if("serviceWorker" in navigator && location.protocol!=="blob:") navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
</script>
